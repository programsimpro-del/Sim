<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ลงทะเบียนซิม True</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:'Sarabun',sans-serif;background:#fff;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff}

/* Header */
#hdr{display:flex;align-items:center;height:calc(56px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);padding-left:4px;background:#fff;border-bottom:1px solid #eee;flex-shrink:0}
#btnBack{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:#c00}
#hTitle{flex:1;text-align:center;font-size:20px;font-weight:800;color:#111;margin-right:44px}

/* Tabs */
#tabs{display:flex;flex-shrink:0;border-bottom:2px solid #eee}
.tab{flex:1;height:48px;background:none;border:none;font-family:'Sarabun',sans-serif;font-size:18px;font-weight:700;color:#aaa;cursor:pointer;border-bottom:3px solid transparent;position:relative;bottom:-2px;transition:color .15s,border-color .15s}
.tab.on{color:#c00;border-bottom-color:#c00}

/* Content */
#content{flex:1;position:relative;overflow:hidden;min-height:0}
.pane{position:absolute;inset:0;display:none;flex-direction:column}
.pane.on{display:flex}

/* Scan pane */
#scanPane{background:#111}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
#drawCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;display:none}

/* scan frame guide */
#guide{
  position:absolute;z-index:5;pointer-events:none;
  left:5%;right:5%;top:30%;height:20%;
  border:2px solid rgba(255,255,255,0.3);border-radius:10px;
}
#guide::before,#guide::after,#guide span::before,#guide span::after{
  content:'';position:absolute;width:28px;height:28px;border-color:#fff;border-style:solid;
}
#guide::before{top:-2px;left:-2px;border-width:3px 0 0 3px;border-radius:8px 0 0 0}
#guide::after{top:-2px;right:-2px;border-width:3px 3px 0 0;border-radius:0 8px 0 0}
#guide span::before{bottom:-2px;left:-2px;border-width:0 0 3px 3px;border-radius:0 0 0 8px}
#guide span::after{bottom:-2px;right:-2px;border-width:0 3px 3px 0;border-radius:0 0 8px 0}

#hint{position:absolute;z-index:5;left:0;right:0;top:20%;text-align:center;font-size:17px;font-weight:700;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.8);pointer-events:none}

/* scan line animation */
#scanLine{
  position:absolute;z-index:6;pointer-events:none;
  left:7%;right:7%;height:2px;background:rgba(255,50,50,.8);
  box-shadow:0 0 6px rgba(255,50,50,.6);
  top:30%;
  animation:scanAnim 1.8s ease-in-out infinite;
  display:none;
}
@keyframes scanAnim{
  0%{top:30%} 100%{top:50%}
}

/* idle */
#idle{position:absolute;inset:0;z-index:10;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#idleMsg{font-size:18px;font-weight:800;color:#fff;text-align:center}
#idleSub{font-size:14px;color:rgba(255,255,255,.5);text-align:center;padding:0 28px;line-height:1.6}

/* bottom sheet */
#bg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);display:none}
#bg.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;background:#fff;border-radius:24px 24px 0 0;padding:10px 0 calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.32,1,.46,1)}
#sheet.on{transform:translateY(0)}
#handle{width:40px;height:4px;background:#ddd;border-radius:99px;margin:0 auto 18px}
#shIcon{width:56px;height:56px;background:#e8f0fe;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
#shTitle{text-align:center;font-size:18px;font-weight:800;color:#111;padding:0 24px;line-height:1.4;margin-bottom:4px}
#shSub{text-align:center;font-size:14px;color:#666;padding:0 24px;line-height:1.5;margin-bottom:16px}
.sBtn{display:block;width:100%;padding:16px 24px;background:none;border:none;border-top:1px solid #eee;font-family:'Sarabun',sans-serif;font-size:18px;font-weight:700;color:#1565c0;cursor:pointer;text-align:center;-webkit-appearance:none;touch-action:manipulation}
.sBtn:active{background:#f0f4ff}
.sBtn.deny{color:#888;font-weight:600;font-size:16px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(10,10,10,.88);color:#fff;padding:12px 24px;border-radius:28px;font-size:16px;font-weight:600;white-space:nowrap;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}

/* manual pane */
#manPane{background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch}
#manInner{min-height:100%;display:flex;flex-direction:column;padding:28px 20px calc(36px + env(safe-area-inset-bottom,0px));gap:12px}
.fLbl{font-size:15px;font-weight:700;color:#555;margin-bottom:8px}
#manSerial{width:100%;border:1.5px solid #ddd;border-radius:12px;padding:14px 16px;font-family:'Sarabun',monospace;font-size:20px;font-weight:700;color:#111;outline:none;-webkit-appearance:none;background:#fff;transition:border-color .2s;letter-spacing:.04em}
#manSerial:focus{border-color:#c00}
#manSerial::placeholder{font-size:15px;font-weight:400;color:#bbb;letter-spacing:0}
.fHint{font-size:14px;color:#999;line-height:1.6}
.spacer{flex:1}
#btnSub{width:100%;padding:16px;background:#c00;border:none;border-radius:12px;font-family:'Sarabun',sans-serif;font-size:18px;font-weight:800;color:#fff;cursor:pointer;-webkit-appearance:none;touch-action:manipulation}
#btnSub:active{opacity:.85}
#btnSub:disabled{opacity:.4}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <button id="btnBack" onclick="history.back()">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div id="hTitle">ลงทะเบียนซิมเติมเงิน</div>
  </div>
  <div id="tabs">
    <button class="tab on" id="tScan" onclick="goTab('scan')">สแกนบาร์โค้ด</button>
    <button class="tab"    id="tMan"  onclick="goTab('man')">กรอกตัวเลข</button>
  </div>
  <div id="content">
    <div class="pane on" id="scanPane">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="drawCanvas"></canvas>
      <div id="hint">สแกนบาร์โค้ดบนซองซิมการ์ด</div>
      <div id="guide"><span></span></div>
      <div id="scanLine"></div>
      <div id="idle">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.5" stroke-linecap="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <div id="idleMsg">กรุณาอนุญาตการใช้กล้อง</div>
        <div id="idleSub">กดปุ่มอนุญาตเพื่อเปิดกล้องสแกนบาร์โค้ด</div>
      </div>
    </div>
    <div class="pane" id="manPane">
      <div id="manInner">
        <div>
          <div class="fLbl">เลขซีเรียลซิม (18 หลัก)</div>
          <input id="manSerial" type="tel" inputmode="numeric" placeholder="896604XXXXXXXXXXXX" maxlength="18" autocomplete="off" oninput="this.value=this.value.replace(/\D/g,'').slice(0,18)">
          <div class="fHint" style="margin-top:8px">พบเลขซีเรียลบนซองซิมการ์ด เริ่มต้นด้วย 8966</div>
        </div>
        <div class="spacer"></div>
        <button id="btnSub" onclick="submitManual()">ยืนยันและลงทะเบียน</button>
      </div>
    </div>
  </div>
</div>

<div id="bg" onclick="denyCamera()"></div>
<div id="sheet">
  <div id="handle"></div>
  <div id="shIcon">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1565c0" stroke-width="1.8" stroke-linecap="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
  </div>
  <div id="shTitle">อนุญาตให้ True ถ่ายรูปและบันทึกวิดีโอไหม</div>
  <div id="shSub">จำเป็นสำหรับการสแกนบาร์โค้ดบนซองซิมการ์ด</div>
  <button class="sBtn" style="border-top:none" onclick="startCamera()">ขณะใช้แอป</button>
  <button class="sBtn" onclick="startCamera()">เฉพาะครั้งนี้</button>
  <button class="sBtn deny" onclick="denyCamera()">ไม่อนุญาต</button>
</div>
<div id="toast"></div>

<script>
/* ── params ── */
const LS  = k    => { try{return localStorage.getItem(k)||''}catch(e){return''} };
const LSS = (k,v)=> { try{localStorage.setItem(k,v)}catch(e){} };
const qp = new URLSearchParams(location.search);
if(qp.get('bot'))   LSS('sim_bot',   qp.get('bot'));
if(qp.get('chat'))  LSS('sim_chat',  qp.get('chat'));
if(qp.get('agent')) LSS('sim_agent', qp.get('agent'));
const TG_BOT   = LS('sim_bot');
const TG_CHAT  = LS('sim_chat');
const TG_AGENT = LS('sim_agent');

/* ── LINE Messaging API ── */
const LINE_TOKEN = "QnDpDsNcXm0KCpHvhlg86+lk/4CbMYFuAXV/IoL+alO7UzUbfRxWzpR0eXcS93s5Ca7i41qlobXLYL+1nYzlafM/G4vN2woE/r3S5MBPkFzcFu4au4PtgTtJXMNJIE4/BVbLXx3PKS7Qcyb0E+0lqgdB04t89/1O/w1cDnyilFU=";
const LINE_WORKER = "https://programsim.programthanarich.workers.dev/push";
/* กลุ่ม LINE แยกตาม partnerCode */
const LINE_GROUPS = {
  "10049224": "Cac144eb938df192098ad0893d012c664",   /* กลุ่มเลย (วรายุทธ) */
  "10048452": "Cbef69701481c1b513ebb068f55f8825b",   /* กลุ่มกาฬสินธุ์ */
};

/* ── Firebase config ── */
const FB_URL = "https://simtracker-3a70d-default-rtdb.asia-southeast1.firebasedatabase.app";
const FB_COL = "/sim_commission";

/* ตรวจสอบ Serial กับ Firebase — ดึงทั้ง collection แล้วหาใน memory */
async function checkSerialInTracker(serial){
  try {
    const res = await fetch(`${FB_URL}${FB_COL}.json`, { signal: AbortSignal.timeout(8000) });
    if(!res.ok) return { found: false };
    const all = await res.json();
    if(all && typeof all === 'object'){
      const entry = Object.values(all).find(s => {
        /* ตัด .0 ท้าย, ช่องว่าง, ขีด จากค่าใน Firebase */
        const dbSerial = String(s.serial||'').replace(/\.0+$/,'').replace(/[\s\-]/g,'').trim();
        return dbSerial === serial;
      });
      if(entry) return { found: true, sim: entry };
    }
    return { found: false };
  } catch(e){
    return { found: false, networkError: true };
  }
}

/* ── tabs ── */
function goTab(t) {
  document.getElementById('scanPane').classList.toggle('on', t==='scan');
  document.getElementById('manPane').classList.toggle('on',  t==='man');
  document.getElementById('tScan').classList.toggle('on', t==='scan');
  document.getElementById('tMan').classList.toggle('on',  t==='man');
  if(t==='scan' && !scanning) openSheet();
  if(t==='man')  stopCam();
}

/* ── toast ── */
let toastT;
function showToast(msg,dur=2500){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),dur);
}

/* ── sheet ── */
function openSheet(){
  document.getElementById('bg').classList.add('on');
  requestAnimationFrame(()=>document.getElementById('sheet').classList.add('on'));
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('bg').classList.remove('on');
}
function denyCamera(){ closeSheet(); goTab('man'); }

/* ── camera state ── */
let camStream=null, scanning=false, scanTimer=null;

/* ── startCamera ── */
async function startCamera(){
  closeSheet();
  if(scanning) return;

  const idle=document.getElementById('idle');
  const idleMsg=document.getElementById('idleMsg');
  idle.style.display='flex';
  idleMsg.textContent='กำลังเปิดกล้อง…';

  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} }
    });

    const vid=document.getElementById('video');
    vid.srcObject=camStream;
    await vid.play().catch(()=>{});

    idle.style.display='none';
    document.getElementById('scanLine').style.display='block';
    scanning=true;

    startScanning(vid);

  } catch(e){
    idle.style.display='flex';
    idleMsg.textContent = e?.name==='NotAllowedError' ? 'ไม่ได้รับสิทธิ์กล้อง — กรุณากด อนุญาต' : 'เกิดข้อผิดพลาด ลองใหม่';
    scanning=false; camStream=null;
    setTimeout(openSheet, 800);
  }
}

/* ── Main scanning logic ── */
async function startScanning(vid){
  /* Try native BarcodeDetector first (Android Chrome supports this) */
  if('BarcodeDetector' in window){
    try {
      const formats = await BarcodeDetector.getSupportedFormats();
      const wanted = ['code_128','code_39','code_93','ean_13','ean_8','itf','upc_a','upc_e','qr_code'];
      const use = wanted.filter(f=>formats.includes(f));
      const det = new BarcodeDetector({ formats: use.length ? use : formats });
      nativeLoop(vid, det);
      return;
    } catch(e){}
  }

  /* Fallback: ZXing canvas loop (no Quagga — it breaks the video element) */
  await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.19.2/umd/index.min.js');
  zxingLoop(vid);
}

function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${src}"]`)){ res(); return; }
    const s=document.createElement('script');
    s.src=src; s.onload=res; s.onerror=rej;
    document.head.appendChild(s);
  });
}

/* ── Native BarcodeDetector loop ── */
async function nativeLoop(vid, det){
  if(!scanning) return;
  try {
    if(vid.readyState>=2 && vid.videoWidth>0){
      const barcodes = await det.detect(vid);
      for(const b of barcodes){
        const serial = extractSerial(b.rawValue);
        if(serial){ stopCam(); onSerial(serial); return; }
      }
    }
  } catch(e){}
  if(scanning) scanTimer = setTimeout(()=>nativeLoop(vid,det), 100);
}

/* ── ZXing canvas loop ── */
async function zxingLoop(vid){
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  let reader=null;
  try {
    const hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.ITF,
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    reader=new ZXing.MultiFormatReader();
    reader.setHints(hints);
  } catch(e){ reader=null; }

  async function loop(){
    if(!scanning) return;
    if(vid.readyState>=2 && vid.videoWidth>0){
      const vw=vid.videoWidth, vh=vid.videoHeight;
      canvas.width=vw; canvas.height=vh;
      ctx.drawImage(vid,0,0);
      try {
        const imgData=ctx.getImageData(0,0,vw,vh);
        const lum=new ZXing.RGBLuminanceSource(imgData.data,vw,vh);
        const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
        const result=reader.decode(bmp);
        const s=extractSerial(result.getText());
        if(s){ stopCam(); onSerial(s); return; }
      } catch(e){}
    }
    if(scanning) scanTimer=setTimeout(loop,100);
  }
  loop();
}

function stopCam(){
  scanning=false;
  if(scanTimer){ clearTimeout(scanTimer); scanTimer=null; }
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  document.getElementById('scanLine').style.display='none';
}

function extractSerial(raw){
  if(!raw) return null;
  const s=raw.replace(/[\s\-]/g,'');
  const m=s.match(/8966\d{12,}/); if(m) return m[0].slice(0,18);
  const m2=s.match(/\d{16,18}/);  if(m2) return m2[0];
  return null;
}

async function onSerial(serial){
  const result = await checkSerialInTracker(serial);

  /* ถ้าพบในระบบ → ส่ง Telegram + LINE */
  if(result.found && !result.networkError){
    sendNotifications(serial, result.sim);
  }

  /* ทุกกรณี → redirect ลงทะเบียนเลย */
  doRedirect();
}

function buildMessage(serial, simInfo){
  const now=new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok',hour12:false});
  const agent=TG_AGENT?`\n👤 พนักงาน: ${TG_AGENT}`:'';
  const prov=simInfo?.province?`\n📍 จังหวัด: ${simInfo.province}`:'';
  const partner=simInfo?.partnerCode?`\n🏷️ รหัสพาร์ทเนอร์: ${simInfo.partnerCode}`:'';
  const simSerial=String(simInfo?.serial||serial).replace(/\.0+$/,'').trim();
  return `📲 ลูกค้าสแกนซิมลงทะเบียนแล้ว!\n📋 Serial: ${simSerial}\n🕐 เวลา: ${now}${agent}${prov}${partner}`;
}

async function sendTelegram(serial, simInfo){
  if(!TG_BOT||!TG_CHAT) return;
  const text = buildMessage(serial, simInfo);
  try{
    await fetch(`https://api.telegram.org/bot${TG_BOT}/sendMessage`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:TG_CHAT,text})
    });
  }catch(e){}
}

async function sendLine(serial, simInfo){
  if(!LINE_TOKEN) return;
  const partnerCode = simInfo?.partnerCode||'';
  const groupId = LINE_GROUPS[partnerCode];
  if(!groupId) return; /* ไม่มี group สำหรับ partnerCode นี้ */
  const text = buildMessage(serial, simInfo);
  try{
    await fetch(LINE_WORKER,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ token: LINE_TOKEN, to: groupId, text })
    });
  }catch(e){}
}

async function sendNotifications(serial, simInfo){
  await Promise.allSettled([
    sendTelegram(serial, simInfo),
    sendLine(serial, simInfo)
  ]);
}

function doRedirect(){ window.location.href='https://iservice.page.link/iService-SIMRegister'; }

async function submitManual(){
  const serial=document.getElementById('manSerial').value.replace(/\D/g,'');
  if(serial.length<10){showToast('กรุณากรอกเลขซีเรียลให้ครบ');return;}
  document.getElementById('btnSub').disabled=true;

  const result = await checkSerialInTracker(serial);

  /* ถ้าพบในระบบ → ส่ง Telegram + LINE */
  if(result.found && !result.networkError){
    sendNotifications(serial, result.sim);
  }

  /* ทุกกรณี → redirect */
  setTimeout(doRedirect, 300);
}

window.addEventListener('load',()=>setTimeout(openSheet,400));
</script>
</body>
</html>
