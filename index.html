<title>ลงทะเบียนซิม True</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/zxing-js/0.21.1/umd/index.min.js"></script>

<style>
:root {
  --true-red: #e8001c;
  --bg: #fff;
  --fg: #1a1a1a;
  --fg-dim: #888;
  --fg-light: #bbb;
  --border: #e8e8e8;
  --tab-h: 48px;
  --hdr-h: 52px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #fff; --fg: #1a1a1a; --fg-dim: #888; --border: #e8e8e8;
    color-scheme: light;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  width: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Sarabun', system-ui, sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ── App Shell — fills whole viewport ── */
.app {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
}

/* ── Header ── */
.hdr {
  display: flex;
  align-items: center;
  height: calc(var(--hdr-h) + env(safe-area-inset-top, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-inline: 4px;
  flex-shrink: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 10;
}
.hdr-back {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer;
  color: var(--true-red);
  flex-shrink: 0;
}
.hdr-back svg { display: block; }
.hdr-title {
  flex: 1;
  text-align: center;
  font-size: 17px;
  font-weight: 700;
  color: var(--fg);
  margin-right: 44px;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  flex-shrink: 0;
  background: var(--bg);
  border-bottom: 1.5px solid var(--border);
  position: relative;
  z-index: 10;
}
.tab-btn {
  flex: 1;
  height: var(--tab-h);
  background: none;
  border: none;
  border-bottom: 2.5px solid transparent;
  font-family: 'Sarabun', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--fg-dim);
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  position: relative;
  bottom: -1px;
}
.tab-btn.active {
  color: var(--true-red);
  border-bottom-color: var(--true-red);
}

/* ── Content area — fills remaining height ── */
.content {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
  width: 100%;
}

/* ── Panes — each fills content area absolutely ── */
.pane {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100%;
  height: 100%;
  display: none;
}
.pane.active { display: flex; flex-direction: column; }

/* ══════════════════════════
   SCAN PANE — True App style
   ══════════════════════════ */
.scan-pane {
  background: #3a3a3a;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

/* Camera feed fills the whole pane */
#video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  z-index: 1;
}

/* Dark overlay tint over camera — True app style grey */
.cam-vignette-top { display: none; }
.cam-vignette-bottom { display: none; }

/* Full dark overlay with hole cut-out effect (CSS only) */
.scan-overlay-bg {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  /* semi-transparent dark overlay everywhere */
  background: rgba(0,0,0,0.45);
}

/* Instruction text above frame */
.cam-label {
  position: absolute;
  left: 0; right: 0;
  top: calc(50% - 80px);
  transform: translateY(-100%);
  padding-bottom: 16px;
  text-align: center;
  font-size: 16px; font-weight: 600;
  color: #fff;
  z-index: 4;
  pointer-events: none;
  letter-spacing: 0.01em;
}

/* Scan frame wrapper — centred */
.scan-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 3; pointer-events: none;
}

.scan-frame {
  position: relative;
  width: 84%;
  aspect-ratio: 3.2 / 1;
  /* frosted rectangle inside */
  background: rgba(180,180,180,0.18);
  border-radius: 14px;
}

/* Four L-shaped corners — grey like True app */
.scan-frame::before, .scan-frame::after,
.scan-frame > span::before, .scan-frame > span::after {
  content: '';
  position: absolute;
  width: 32px; height: 32px;
  border-color: rgba(220,220,220,0.9);
  border-style: solid;
}
.scan-frame::before  { top: -2px; left: -2px;   border-width: 3px 0 0 3px; border-radius: 10px 0 0 0; }
.scan-frame::after   { top: -2px; right: -2px;  border-width: 3px 3px 0 0; border-radius: 0 10px 0 0; }
.scan-frame > span::before { bottom: -2px; left: -2px;  border-width: 0 0 3px 3px; border-radius: 0 0 0 10px; }
.scan-frame > span::after  { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-radius: 0 0 10px 0; }

/* No scan line — matches True app */
.scan-line { display: none; }

/* Torch / zoom controls */
.cam-controls {
  position: absolute;
  bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  left: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 20px;
  z-index: 5;
}
.cam-ctrl-btn {
  width: 48px; height: 48px;
  background: rgba(0,0,0,0.4);
  border: 1.5px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; cursor: pointer; font-size: 20px;
  transition: background 0.15s;
  flex-shrink: 0;
}
.cam-ctrl-btn.on {
  background: rgba(255,210,0,0.35);
  border-color: rgba(255,210,0,0.7);
  color: #ffe033;
}
.cam-ctrl-btn:active { background: rgba(255,255,255,0.2); }

.zoom-label {
  font-size: 14px; font-weight: 700; color: #fff;
  min-width: 40px; text-align: center;
  cursor: pointer;
  background: rgba(0,0,0,0.4);
  border: 1.5px solid rgba(255,255,255,0.25);
  border-radius: 20px;
  padding: 9px 16px;
}

/* Idle overlay */
.cam-idle {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px;
  background: #3a3a3a;
  cursor: pointer;
  z-index: 6;
}
.cam-idle-icon {
  width: 64px; height: 64px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
}
.cam-idle p {
  font-size: 14px; font-weight: 600;
  color: rgba(255,255,255,0.7);
  text-align: center;
}

/* Result overlay inside camera area */
.cam-result {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.85);
  z-index: 7;
  padding: 32px 24px;
  gap: 18px;
  animation: fadeIn 0.22s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.cam-result-badge {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 24px;
  padding: 7px 18px;
  font-size: 14px; font-weight: 700; color: #fff;
}
.cam-result-badge .dot-ok {
  width: 8px; height: 8px; border-radius: 50%;
  background: #4ade80; flex-shrink: 0;
}

.cam-serial {
  font-size: 26px; font-weight: 800;
  color: #fff;
  letter-spacing: 0.06em;
  font-variant-numeric: tabular-nums;
  text-align: center;
  word-break: break-all;
}

.cam-tg-status {
  font-size: 13px; font-weight: 600;
  color: rgba(255,255,255,0.65);
  text-align: center;
}
.cam-tg-ok  { color: #4ade80; }
.cam-tg-err { color: #fbbf24; }

.redirect-bar {
  width: 65%; height: 4px;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  overflow: hidden;
}
.redirect-fill {
  height: 100%;
  background: var(--true-red);
  border-radius: 2px;
  width: 0%;
  animation: fillBar 2.4s linear forwards;
}
@keyframes fillBar { to { width: 100%; } }

.redirect-text {
  font-size: 12px; font-weight: 600;
  color: rgba(255,255,255,0.5);
}

.btn-rescan {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 10px;
  padding: 11px 28px;
  font-family: 'Sarabun', sans-serif;
  font-size: 14px; font-weight: 700;
  color: #fff; cursor: pointer;
  transition: background 0.15s;
}
.btn-rescan:active { background: rgba(255,255,255,0.22); }

/* ══════════════════════════
   MANUAL PANE — fills full remaining space
   ══════════════════════════ */
.manual-pane {
  background: var(--bg);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.manual-inner {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding: 28px 20px;
  padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
  gap: 20px;
}

.field-block { display: flex; flex-direction: column; gap: 8px; }
.field-lbl {
  font-size: 13px; font-weight: 700;
  color: var(--fg-dim);
}
.serial-input {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 15px 16px;
  font-family: 'Sarabun', monospace;
  font-size: 20px; font-weight: 700;
  color: var(--fg);
  outline: none;
  letter-spacing: 0.05em;
  transition: border-color 0.18s;
  -webkit-appearance: none;
  background: var(--bg);
}
.serial-input:focus { border-color: var(--true-red); }
.serial-input::placeholder { color: var(--fg-light); font-weight: 400; font-size: 15px; letter-spacing: 0; }

.field-hint { font-size: 12.5px; color: var(--fg-dim); line-height: 1.6; }

.spacer { flex: 1; }

.btn-submit {
  width: 100%;
  padding: 17px;
  background: var(--true-red);
  border: none;
  border-radius: 12px;
  font-family: 'Sarabun', sans-serif;
  font-size: 17px; font-weight: 800;
  color: #fff; cursor: pointer;
  transition: opacity 0.15s;
  -webkit-appearance: none;
}
.btn-submit:active { opacity: 0.85; }
.btn-submit:disabled { opacity: 0.45; cursor: not-allowed; }

.manual-result {
  background: #f6fef9;
  border: 1.5px solid #86efac;
  border-radius: 12px;
  padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
  animation: popIn 0.22s ease;
}
.manual-result.err { background: #fff5f5; border-color: #fca5a5; }
@keyframes popIn { from { transform: scale(0.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.result-serial { font-size: 17px; font-weight: 800; color: var(--fg); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.result-status { font-size: 13px; font-weight: 600; color: #16a34a; }
.manual-result.err .result-status { color: #dc2626; }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  left: 50%; transform: translateX(-50%);
  background: rgba(30,30,30,0.92);
  color: #fff; padding: 9px 20px;
  border-radius: 24px; font-size: 13px; font-weight: 600;
  white-space: nowrap; z-index: 999;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.toast.show { opacity: 1; }
</style>

<div class="app">
  <!-- Header -->
  <div class="hdr">
    <button class="hdr-back" onclick="history.back()" aria-label="ย้อนกลับ">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <div class="hdr-title">ลงทะเบียนซิมเติมเงิน</div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tabScan" onclick="switchTab('scan')">สแกนบาร์โค้ด</button>
    <button class="tab-btn" id="tabManual" onclick="switchTab('manual')">กรอกตัวเลข</button>
  </div>

  <!-- Content area -->
  <div class="content">

    <!-- ── Scan Pane ── -->
    <div class="pane active scan-pane" id="paneScan">
      <video id="video" playsinline muted autoplay></video>

      <!-- dark overlay tint -->
      <div class="scan-overlay-bg"></div>

      <!-- label above frame -->
      <div class="cam-label">สแกนบาร์โค้ดบนซองซิมการ์ด</div>

      <div class="scan-overlay">
        <div class="scan-frame">
          <span></span>
          <div class="scan-line"></div>
        </div>
      </div>

      <!-- Idle overlay -->
      <div class="cam-idle" id="camIdle" onclick="startCamera()">

            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>

      <!-- Result overlay -->
      <div class="cam-result" id="camResult" hidden>

        </div>
        <div class="cam-serial" id="camSerialText"></div>
        <div class="cam-tg-status" id="camTgStatus">⏳ กำลังส่งให้เจ้าของร้าน...</div>
        <div class="redirect-bar">
          <div class="redirect-fill" id="camRedirectFill"></div>
        </div>
        <div class="redirect-text">กำลังพาคุณไปลงทะเบียน True...</div>
        <button class="btn-rescan" onclick="resetScan()">สแกนซิมใหม่</button>
      </div>
    </div>

    <!-- ── Manual Pane ── -->
    <div class="pane manual-pane" id="paneManual">
      <div class="manual-inner">
        <div class="field-block">
          <div class="field-lbl">เลขซีเรียลซิม (18 หลัก)</div>
          <input
            class="serial-input"

        <div id="manualResult"></div>

        <button class="btn-submit" id="btnSubmit" onclick="submitManual()">

  </div><!-- /content -->
</div>

<div class="toast" id="toast"></div>

<script>
// ── Auto-start camera on load ──
// Mobile browsers require a user gesture OR the page being https
// We try auto-start, and if it fails show a tap-to-start button
window.addEventListener('load', () => {
  const tryStart = () => {
    if (typeof ZXing !== 'undefined') {
      startCamera();
    } else {
      setTimeout(tryStart, 150);
    }
  };
  // Short delay to let page paint first
  setTimeout(tryStart, 500);
});

// ── Config — Telegram via URL param ──
const LS  = k   => { try { return localStorage.getItem(k) || '' } catch(e) { return '' } };
const LSS = (k,v) => { try { localStorage.setItem(k,v) } catch(e) {} };

const urlParams = new URLSearchParams(location.search);
if (urlParams.get('bot'))  LSS('sim_tgbot',  urlParams.get('bot'));
if (urlParams.get('chat')) LSS('sim_tgchat', urlParams.get('chat'));

let tgBot  = LS('sim_tgbot');
let tgChat = LS('sim_tgchat');

// ── Tab switching ──
function switchTab(tab) {
  ['scan','manual'].forEach(t => {
    const P = 'pane' + t.charAt(0).toUpperCase() + t.slice(1);
    const T = 'tab'  + t.charAt(0).toUpperCase() + t.slice(1);
    const pane = document.getElementById(P);
    const btn  = document.getElementById(T);
    if (pane) pane.classList.toggle('active', t === tab);
    if (btn)  btn.classList.toggle('active',  t === tab);
  });
  if (tab === 'scan') {
    // Resume camera if not scanning
    if (!scanning) setTimeout(() => startCamera(), 100);
  } else {
    stopCamera();
  }
}

// ── Toast ──
let toastTimer;
function showToast(msg, dur = 2800) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}

// ── Camera / ZXing ──
let codeReader  = null;
let scanning    = false;
let mediaStream = null;
let torchOn     = false;
let zoomLevels  = [1, 1.5, 2];
let zoomIdx     = 0;

async function startCamera() {
  if (scanning) return;
  const idle = document.getElementById('camIdle');
  if (idle) idle.hidden = true;

  try {
    if (typeof ZXing === 'undefined') { showToast('กำลังโหลดระบบสแกน...'); return; }

    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.QR_CODE,
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

    codeReader = new ZXing.BrowserMultiFormatReader(hints, { delayBetweenScanAttempts: 80 });

    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width:  { ideal: 1920, min: 640 },
          height: { ideal: 1080, min: 480 },
          frameRate: { ideal: 30, min: 15 },
        }
      });
    } catch(e) {
      mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    }

    const videoEl = document.getElementById('video');
    videoEl.srcObject = mediaStream;
    await videoEl.play().catch(() => {});

    const track = mediaStream.getVideoTracks()[0];
    if (track) {
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      const adv = {};
      if (caps.focusMode && caps.focusMode.includes('continuous')) adv.focusMode = 'continuous';
      if (caps.zoom) { zoomLevels = buildZoomLevels(caps.zoom); adv.zoom = zoomLevels[0]; }
      if (Object.keys(adv).length) { try { await track.applyConstraints({ advanced: [adv] }); } catch(e) {} }
      const btnT = document.getElementById('btnTorch');
      const zlEl = document.getElementById('zoomLabel');
      if (btnT) btnT.hidden = !caps.torch;
      if (zlEl) zlEl.hidden = !caps.zoom;
    }

    document.getElementById('camControls').hidden = false;
    scanning = true;

    codeReader.decodeFromVideoElement('video', (result, err) => {
      if (result) {
        const serial = extractSerial(result.getText());
        if (serial) { stopCamera(); onSerialDetected(serial, 'scan'); }
      }
    });

  } catch(e) {
    if (idle) idle.hidden = false;
    const msg = document.getElementById('camIdleMsg');
    if (msg) {
      if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
        msg.textContent = '⚠️ กรุณาอนุญาตใช้กล้อง';
      } else if (e.name === 'NotFoundError') {
        msg.textContent = '⚠️ ไม่พบกล้องในอุปกรณ์';
      } else {
        msg.textContent = 'แตะที่นี่เพื่อเปิดกล้อง';
      }
    }
    const ctrl = document.getElementById('camControls');
    if (ctrl) ctrl.hidden = true;
    scanning = false;
    console.error('Camera error:', e.name, e.message);
  }
}

function buildZoomLevels(cap) {
  const min = cap.min || 1, max = cap.max || 4;
  const lvls = [min];
  const mid = Math.min(2, max);
  if (mid > min + 0.2) lvls.push(mid);
  if (max > mid + 0.2) lvls.push(Math.min(max, 3));
  return lvls;
}

async function toggleTorch() {
  if (!mediaStream) return;
  const track = mediaStream.getVideoTracks()[0];
  if (!track) return;
  torchOn = !torchOn;
  try {
    await track.applyConstraints({ advanced: [{ torch: torchOn }] });
    document.getElementById('btnTorch').classList.toggle('on', torchOn);
  } catch(e) { torchOn = !torchOn; showToast('ไฟฉายไม่รองรับในอุปกรณ์นี้'); }
}

async function cycleZoom() {
  if (!mediaStream) return;
  const track = mediaStream.getVideoTracks()[0];
  if (!track) return;
  zoomIdx = (zoomIdx + 1) % zoomLevels.length;
  const z = zoomLevels[zoomIdx];
  try {
    await track.applyConstraints({ advanced: [{ zoom: z }] });
    document.getElementById('zoomLabel').textContent = z === 1 ? '1×' : z.toFixed(1) + '×';
  } catch(e) {}
}

function stopCamera() {
  if (codeReader) { try { codeReader.reset(); } catch(e) {} codeReader = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  torchOn = false; zoomIdx = 0;
  const ctrl = document.getElementById('camControls');
  if (ctrl) ctrl.hidden = true;
  const btnT = document.getElementById('btnTorch');
  if (btnT) btnT.classList.remove('on');
  const zl = document.getElementById('zoomLabel');
  if (zl) zl.textContent = '1×';
  scanning = false;
}

function extractSerial(raw) {
  const s = raw.replace(/\s/g, '');
  const m = s.match(/8966\d{14}/);
  if (m) return m[0];
  if (/^\d{18}$/.test(s)) return s;
  const m2 = s.match(/\d{18}/);
  return m2 ? m2[0] : null;
}

function resetScan() {
  document.getElementById('camResult').hidden = true;
  startCamera();
}

// ── Serial detected ──
async function onSerialDetected(serial, mode) {
  const now = new Date().toLocaleString('th-TH', {
    timeZone: 'Asia/Bangkok', hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });

  if (mode === 'scan') {
    document.getElementById('camSerialText').textContent = serial;
    document.getElementById('camTgStatus').textContent   = '⏳ กำลังส่งให้เจ้าของร้าน...';
    document.getElementById('camTgStatus').className     = 'cam-tg-status';
    const fill = document.getElementById('camRedirectFill');
    fill.style.animation = 'none';
    void fill.offsetWidth;
    fill.style.animation = '';
    document.getElementById('camResult').hidden = false;

    const tgOk = await sendTelegram(serial, mode, now);
    updateTgStatus(document.getElementById('camTgStatus'), tgOk, 'cam');
    setTimeout(() => redirectToTrue(serial), 2500);

  } else {
    const el = document.getElementById('manualResult');
    el.innerHTML = `
      <div class="manual-result" id="mRes">
        <div class="result-serial">${serial}</div>
        <div class="result-status" id="mTgStatus">⏳ กำลังส่งให้เจ้าของร้าน...</div>
      </div>`;
    document.getElementById('btnSubmit').disabled = true;
    const tgOk = await sendTelegram(serial, mode, now);
    const mTg = document.getElementById('mTgStatus');
    if (mTg) updateTgStatus(mTg, tgOk, 'manual');
    setTimeout(() => redirectToTrue(serial), 2500);
    setTimeout(() => { const b = document.getElementById('btnSubmit'); if(b) b.disabled = false; }, 3500);
  }
}

function updateTgStatus(el, tgOk, ctx) {
  if (!el) return;
  if (tgOk === true) {
    el.textContent = '✅ ส่งแจ้งเตือนเจ้าของร้านแล้ว';
    el.className   = ctx === 'cam' ? 'cam-tg-status cam-tg-ok' : el.className;
    if (ctx !== 'cam') el.style.color = '#16a34a';
  } else if (tgOk === false) {
    el.textContent = '⚠️ ส่ง Telegram ไม่ได้ — แจ้งพนักงาน';
    el.className   = ctx === 'cam' ? 'cam-tg-status cam-tg-err' : el.className;
    if (ctx !== 'cam') el.style.color = '#d97706';
  } else {
    el.textContent = 'ℹ️ ยังไม่ตั้งค่า Telegram';
  }
}

async function sendTelegram(serial, mode, now) {
  if (!tgBot || !tgChat) return null;
  const msg = `📲 ลูกค้าสแกนซิมแล้ว!\n📋 Serial: ${serial}\n🕐 เวลา: ${now}\n📥 วิธีรับ: ${mode === 'scan' ? 'สแกนบาร์โค้ด' : 'กรอกเอง'}\n\n⏩ กำลังพาลูกค้าไปลงทะเบียน True...`;
  try {
    const r = await fetch(`https://api.telegram.org/bot${tgBot}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: tgChat, text: msg })
    });
    const d = await r.json();
    return d.ok === true;
  } catch(e) { return false; }
}

function redirectToTrue(serial) {
  window.location.href = `https://www.true.th/service/trueservice/registersim/?serial=${encodeURIComponent(serial)}`;
}

function submitManual() {
  const serial = document.getElementById('manualSerial').value.replace(/\D/g, '');
  if (serial.length < 10) { showToast('กรุณากรอกเลขซีเรียลให้ครบ'); return; }
  onSerialDetected(serial, 'manual');
}
