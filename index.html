<title>ลงทะเบียนซิม True</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/zxing-js/0.21.1/umd/index.min.js"></script>

<style>
:root {
  --true-red: #e8001c;
  --bg: #fff;
  --fg: #1a1a1a;
  --fg-dim: #888;
  --fg-light: #bbb;
  --border: #e8e8e8;
  --tab-h: 46px;
  --hdr-h: 52px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #fff;
    --fg: #1a1a1a;
    --fg-dim: #888;
    --border: #e8e8e8;
    color-scheme: light;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Sarabun', system-ui, sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ── App Shell ── */
.app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  background: var(--bg);
  position: relative;
}

/* ── Header ── */
.hdr {
  display: flex;
  align-items: center;
  height: var(--hdr-h);
  padding: 0 4px;
  padding-top: env(safe-area-inset-top, 0px);
  flex-shrink: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  position: relative;
}
.hdr-back {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer;
  color: var(--true-red);
  flex-shrink: 0;
}
.hdr-back svg { display: block; }
.hdr-title {
  flex: 1;
  text-align: center;
  font-size: 17px;
  font-weight: 700;
  color: var(--fg);
  letter-spacing: 0.01em;
  /* offset to account for back button so text is truly centred */
  margin-right: 44px;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  flex-shrink: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.tab-btn {
  flex: 1;
  height: var(--tab-h);
  background: none;
  border: none;
  border-bottom: 2.5px solid transparent;
  font-family: 'Sarabun', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--fg-dim);
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  letter-spacing: 0.01em;
  position: relative;
  bottom: -1px; /* sit on top of tabs border-bottom */
}
.tab-btn.active {
  color: var(--true-red);
  border-bottom-color: var(--true-red);
}

/* ── Content panes ── */
.pane { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.pane.active { display: flex; }

/* ══════════════════════════
   SCAN PANE — full bleed camera
   ══════════════════════════ */
.scan-pane {
  position: relative;
  background: #111;
  flex: 1;
  overflow: hidden;
}

#video {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  /* Flip mirroring — back camera should NOT be mirrored */
  transform: scaleX(1);
}

/* Dark vignette top + bottom */
.cam-vignette-top,
.cam-vignette-bottom {
  position: absolute; left: 0; right: 0;
  pointer-events: none;
  z-index: 2;
}
.cam-vignette-top {
  top: 0; height: 90px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
}
.cam-vignette-bottom {
  bottom: 0; height: 130px;
  background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
}

/* Centre instruction text */
.cam-label {
  position: absolute;
  top: 26px; left: 0; right: 0;
  text-align: center;
  font-size: 15px; font-weight: 600;
  color: #fff;
  z-index: 3;
  pointer-events: none;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}

/* Scan frame — wide rectangle */
.scan-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 3; pointer-events: none;
}
.scan-frame {
  position: relative;
  width: 78%; aspect-ratio: 3.8 / 1;
}
/* Four rounded corners — white, no fill */
.scan-frame::before, .scan-frame::after,
.scan-frame > span::before, .scan-frame > span::after {
  content: '';
  position: absolute;
  width: 26px; height: 26px;
  border-color: #fff;
  border-style: solid;
}
.scan-frame::before  { top: 0; left: 0;   border-width: 3px 0 0 3px; border-radius: 5px 0 0 0; }
.scan-frame::after   { top: 0; right: 0;  border-width: 3px 3px 0 0; border-radius: 0 5px 0 0; }
.scan-frame > span::before { bottom: 0; left: 0;  border-width: 0 0 3px 3px; border-radius: 0 0 0 5px; }
.scan-frame > span::after  { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 5px 0; }

/* Animated scan line */
.scan-line {
  position: absolute; left: 2px; right: 2px; height: 2.5px;
  background: linear-gradient(90deg, transparent 0%, #fff 30%, var(--true-red) 50%, #fff 70%, transparent 100%);
  top: 0;
  animation: scanmove 1.8s ease-in-out infinite;
  box-shadow: 0 0 6px 1px rgba(255,80,80,0.5);
}
@keyframes scanmove {
  0%   { top: 2px;    opacity: 0; }
  6%   { opacity: 1; }
  94%  { opacity: 1; }
  100% { top: calc(100% - 2px); opacity: 0; }
}

/* Torch / zoom controls */
.cam-controls {
  position: absolute;
  bottom: 20px; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 16px;
  z-index: 4;
}
.cam-ctrl-btn {
  width: 44px; height: 44px;
  background: rgba(0,0,0,0.5);
  border: 1.5px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; cursor: pointer; font-size: 18px;
  transition: background 0.15s;
  flex-shrink: 0;
}
.cam-ctrl-btn.on {
  background: rgba(255,210,0,0.35);
  border-color: rgba(255,210,0,0.7);
  color: #ffe033;
}
.cam-ctrl-btn:active { background: rgba(255,255,255,0.2); }

.zoom-label {
  font-size: 14px; font-weight: 700; color: #fff;
  min-width: 36px; text-align: center;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  cursor: pointer;
  background: rgba(0,0,0,0.45);
  border: 1.5px solid rgba(255,255,255,0.25);
  border-radius: 20px;
  padding: 8px 14px;
}

/* Idle overlay (before camera starts) */
.cam-idle {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px;
  background: #111;
  cursor: pointer;
  z-index: 5;
}
.cam-idle-icon {
  width: 64px; height: 64px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
}
.cam-idle p {
  font-size: 14px; font-weight: 600;
  color: rgba(255,255,255,0.65);
  text-align: center;
}

/* Result overlay inside camera area */
.cam-result {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.82);
  z-index: 6;
  padding: 28px 24px;
  gap: 16px;
  animation: fadeIn 0.22s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.cam-result-badge {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 24px;
  padding: 6px 16px;
  font-size: 13px; font-weight: 700; color: #fff;
}
.cam-result-badge .dot-ok {
  width: 7px; height: 7px; border-radius: 50%;
  background: #4ade80; flex-shrink: 0;
}

.cam-serial {
  font-size: 24px; font-weight: 800;
  color: #fff;
  letter-spacing: 0.06em;
  font-variant-numeric: tabular-nums;
  text-align: center;
  word-break: break-all;
}

.cam-tg-status {
  font-size: 13px; font-weight: 600;
  color: rgba(255,255,255,0.65);
  text-align: center;
}
.cam-tg-ok  { color: #4ade80; }
.cam-tg-err { color: #fbbf24; }

.redirect-bar {
  width: 60%; height: 4px;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  overflow: hidden;
}
.redirect-fill {
  height: 100%;
  background: var(--true-red);
  border-radius: 2px;
  width: 0%;
  animation: fillBar 2.4s linear forwards;
}
@keyframes fillBar { to { width: 100%; } }

.redirect-text {
  font-size: 12px; font-weight: 600;
  color: rgba(255,255,255,0.5);
}

.btn-rescan {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 10px;
  padding: 10px 24px;
  font-family: 'Sarabun', sans-serif;
  font-size: 14px; font-weight: 700;
  color: #fff; cursor: pointer;
  transition: background 0.15s;
}
.btn-rescan:active { background: rgba(255,255,255,0.22); }

/* ══════════════════════════
   MANUAL PANE
   ══════════════════════════ */
.manual-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 28px 20px;
  padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  gap: 20px;
  overflow-y: auto;
  background: var(--bg);
}

.field-block { display: flex; flex-direction: column; gap: 8px; }
.field-lbl {
  font-size: 13px; font-weight: 700;
  color: var(--fg-dim);
}
.serial-input {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  font-family: 'Sarabun', monospace;
  font-size: 19px; font-weight: 700;
  color: var(--fg);
  outline: none;
  letter-spacing: 0.05em;
  transition: border-color 0.18s;
  -webkit-appearance: none;
  background: var(--bg);
}
.serial-input:focus { border-color: var(--true-red); }
.serial-input::placeholder { color: var(--fg-light); font-weight: 400; font-size: 15px; letter-spacing: 0; }

.field-hint { font-size: 12px; color: var(--fg-dim); line-height: 1.6; }

/* True-style big red button */
.btn-submit {
  width: 100%;
  padding: 16px;
  background: var(--true-red);
  border: none;
  border-radius: 12px;
  font-family: 'Sarabun', sans-serif;
  font-size: 16px; font-weight: 800;
  color: #fff; cursor: pointer;
  transition: opacity 0.15s;
}
.btn-submit:active { opacity: 0.85; }
.btn-submit:disabled { opacity: 0.45; cursor: not-allowed; }

/* Manual result */
.manual-result {
  background: #f6fef9;
  border: 1.5px solid #86efac;
  border-radius: 12px;
  padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
  animation: popIn 0.22s ease;
}
.manual-result.err {
  background: #fff5f5;
  border-color: #fca5a5;
}
@keyframes popIn { from { transform: scale(0.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.result-serial { font-size: 17px; font-weight: 800; color: var(--fg); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.result-status { font-size: 13px; font-weight: 600; color: #16a34a; }
.manual-result.err .result-status { color: #dc2626; }


/* ── Toast ── */
.toast {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  left: 50%; transform: translateX(-50%);
  background: rgba(30,30,30,0.92);
  color: #fff; padding: 9px 20px;
  border-radius: 24px; font-size: 13px; font-weight: 600;
  white-space: nowrap; z-index: 999;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.toast.show { opacity: 1; }
</style>

<div class="app">
  <!-- Header -->
  <div class="hdr">
    <button class="hdr-back" onclick="history.back()" aria-label="ย้อนกลับ">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <div class="hdr-title">ลงทะเบียนซิมเติมเงิน</div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tabScan" onclick="switchTab('scan')">สแกนบาร์โค้ด</button>
    <button class="tab-btn" id="tabManual" onclick="switchTab('manual')">กรอกตัวเลข</button>
  </div>

  <!-- ── Scan Pane ── -->
  <div class="pane active scan-pane" id="paneScan">
    <video id="video" playsinline muted autoplay></video>

    <div class="cam-vignette-top"></div>
    <div class="cam-vignette-bottom"></div>
    <div class="cam-label">สแกนบาร์โค้ดบนซองซิมการ์ด</div>

    <div class="scan-overlay">
      <div class="scan-frame">
        <span></span>
        <div class="scan-line"></div>
      </div>
    </div>

    <!-- Idle — แสดงชั่วคราวระหว่างโหลด จากนั้นกล้องเปิดอัตโนมัติ -->
    <div class="cam-idle" id="camIdle" onclick="startCamera()">
      <div class="cam-idle-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.8" stroke-linecap="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </div>
      <p id="camIdleMsg">กำลังเปิดกล้อง...</p>
    </div>

    <!-- Torch + Zoom controls (shown after camera starts) -->
    <div class="cam-controls" id="camControls" hidden>
      <button class="cam-ctrl-btn" id="btnTorch" onclick="toggleTorch()" title="ไฟฉาย">
        💡
      </button>
      <div class="zoom-label" id="zoomLabel" onclick="cycleZoom()">1×</div>
    </div>

    <!-- Result overlay (shown after scan) -->
    <div class="cam-result" id="camResult" hidden>
      <div class="cam-result-badge">
        <span class="dot-ok"></span>
        อ่านเลขซีเรียลสำเร็จ
      </div>
      <div class="cam-serial" id="camSerialText"></div>
      <div class="cam-tg-status" id="camTgStatus">⏳ กำลังส่งให้เจ้าของร้าน...</div>
      <div class="redirect-bar">
        <div class="redirect-fill" id="camRedirectFill"></div>
      </div>
      <div class="redirect-text">กำลังพาคุณไปลงทะเบียน True...</div>
      <button class="btn-rescan" onclick="resetScan()">สแกนซิมใหม่</button>
    </div>
  </div>

  <!-- ── Manual Pane ── -->
  <div class="pane manual-pane" id="paneManual">
    <div class="field-block">
      <div class="field-lbl">เลขซีเรียลซิม (18 หลัก)</div>
      <input
        class="serial-input"
        id="manualSerial"
        type="tel"
        inputmode="numeric"
        placeholder="896604XXXXXXXXXXXX"
        maxlength="18"
        autocomplete="off"
        oninput="this.value=this.value.replace(/\D/g,'').slice(0,18)"
      >
      <div class="field-hint">พบเลขซีเรียลบนซองซิมการ์ด เริ่มต้นด้วย 8966</div>
    </div>

    <div id="manualResult"></div>

    <button class="btn-submit" id="btnSubmit" onclick="submitManual()">
      ยืนยันและลงทะเบียน
    </button>

    <!-- Spacer so button isn't jammed at top when result shows -->
    <div style="flex:1"></div>
  </div>

  <!-- Settings pane ถูกลบออกแล้ว — ไม่มี UI ตั้งค่าในหน้าลูกค้า -->
</div>

<div class="toast" id="toast"></div>

<script>
// ── เปิดกล้องอัตโนมัติเมื่อโหลดหน้า ──
window.addEventListener('load', () => {
  // รอ ZXing โหลดเสร็จก่อน แล้วเปิดกล้องทันที
  const tryStart = () => {
    if (typeof ZXing !== 'undefined') {
      startCamera();
    } else {
      setTimeout(tryStart, 200);
    }
  };
  setTimeout(tryStart, 300); // รอ 300ms ให้ page render ก่อน
});

// ── Config — Telegram (ตั้งค่าจาก sim-commission.html ผ่าน URL param) ──
const LS  = k  => { try { return localStorage.getItem(k) || '' } catch(e) { return '' } };
const LSS = (k,v) => { try { localStorage.setItem(k,v) } catch(e) {} };

// รับ bot/chat จาก URL param เช่น ?bot=TOKEN&chat=CHATID (ตั้งค่าครั้งเดียวจาก sim-commission)
// หรือจาก localStorage ที่เคยบันทึกไว้
const urlParams = new URLSearchParams(location.search);
if (urlParams.get('bot'))  LSS('sim_tgbot',  urlParams.get('bot'));
if (urlParams.get('chat')) LSS('sim_tgchat', urlParams.get('chat'));

let tgBot  = LS('sim_tgbot');
let tgChat = LS('sim_tgchat');

// ── Tab switching ──
function switchTab(tab) {
  ['scan','manual'].forEach(t => {
    const paneId = 'pane' + t.charAt(0).toUpperCase() + t.slice(1);
    const tabId  = 'tab'  + t.charAt(0).toUpperCase() + t.slice(1);
    const pane = document.getElementById(paneId);
    const btn  = document.getElementById(tabId);
    if (pane) pane.classList.toggle('active', t === tab);
    if (btn)  btn.classList.toggle('active',  t === tab);
  });
  if (tab !== 'scan') stopCamera();
}

// ── Toast ──
let toastTimer;
function showToast(msg, dur = 2800) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}

// ── Camera / ZXing ──
let codeReader  = null;
let scanning    = false;
let mediaStream = null;
let torchOn     = false;
let zoomLevels  = [1, 1.5, 2];
let zoomIdx     = 0;

async function startCamera() {
  if (scanning) return;
  document.getElementById('camIdle').hidden = true;

  try {
    if (typeof ZXing === 'undefined') { showToast('กำลังโหลดระบบสแกน...'); return; }

    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.QR_CODE,
    ]);
    // Faster decode attempt for barcode-heavy use
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

    codeReader = new ZXing.BrowserMultiFormatReader(hints, { delayBetweenScanAttempts: 80 });

    // Get back camera with barcode-optimised constraints
    const constraints = {
      video: {
        facingMode: { ideal: 'environment' },
        width:  { ideal: 1920, min: 640 },
        height: { ideal: 1080, min: 480 },
        frameRate: { ideal: 30, min: 15 },
        focusMode: { ideal: 'continuous' },
        exposureMode: { ideal: 'continuous' },
        whiteBalanceMode: { ideal: 'continuous' },
      }
    };

    // We need the stream ourselves to apply advanced constraints (zoom/torch)
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch(e) {
      // Fallback: simpler constraints
      mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    }

    const videoEl = document.getElementById('video');
    videoEl.srcObject = mediaStream;
    await videoEl.play().catch(() => {});

    // Apply continuous autofocus + initial zoom via applyConstraints if supported
    const track = mediaStream.getVideoTracks()[0];
    if (track) {
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      const adv = {};
      if (caps.focusMode && caps.focusMode.includes('continuous')) adv.focusMode = 'continuous';
      if (caps.zoom) { zoomLevels = buildZoomLevels(caps.zoom); adv.zoom = zoomLevels[0]; }
      if (Object.keys(adv).length) { try { await track.applyConstraints({ advanced: [adv] }); } catch(e) {} }
      // Show torch button only if torch is supported
      if (caps.torch) document.getElementById('btnTorch').hidden = false;
      else document.getElementById('btnTorch').hidden = true;
      // Show zoom only if zoom is supported
      if (caps.zoom) document.getElementById('zoomLabel').hidden = false;
      else document.getElementById('zoomLabel').hidden = true;
    }

    document.getElementById('camControls').hidden = false;

    scanning = true;
    // Use decodeFromVideoElement so we control the stream ourselves
    codeReader.decodeFromVideoElement('video', (result, err) => {
      if (result) {
        const raw    = result.getText();
        const serial = extractSerial(raw);
        if (serial) {
          stopCamera();
          onSerialDetected(serial, 'scan');
        }
      }
    });

  } catch(e) {
    const idle = document.getElementById('camIdle');
    idle.hidden = false;
    const msg = document.getElementById('camIdleMsg');
    if (msg) msg.textContent = 'กรุณาอนุญาตใช้กล้อง แล้วแตะที่นี่';
    document.getElementById('camControls').hidden = true;
    scanning = false;
  }
}

function buildZoomLevels(zoomCap) {
  const min = zoomCap.min || 1;
  const max = zoomCap.max || 4;
  const lvls = [min];
  const mid = Math.min(2, max);
  if (mid > min + 0.2) lvls.push(mid);
  if (max > mid + 0.2) lvls.push(Math.min(max, 3));
  return lvls;
}

async function toggleTorch() {
  if (!mediaStream) return;
  const track = mediaStream.getVideoTracks()[0];
  if (!track) return;
  torchOn = !torchOn;
  try {
    await track.applyConstraints({ advanced: [{ torch: torchOn }] });
    document.getElementById('btnTorch').classList.toggle('on', torchOn);
  } catch(e) { torchOn = !torchOn; showToast('ไฟฉายไม่รองรับในอุปกรณ์นี้'); }
}

async function cycleZoom() {
  if (!mediaStream) return;
  const track = mediaStream.getVideoTracks()[0];
  if (!track) return;
  zoomIdx = (zoomIdx + 1) % zoomLevels.length;
  const z = zoomLevels[zoomIdx];
  try {
    await track.applyConstraints({ advanced: [{ zoom: z }] });
    document.getElementById('zoomLabel').textContent = z === 1 ? '1×' : z.toFixed(1) + '×';
  } catch(e) {}
}

function stopCamera() {
  if (codeReader) { try { codeReader.reset(); } catch(e) {} codeReader = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  torchOn = false; zoomIdx = 0;
  const ctrl = document.getElementById('camControls');
  if (ctrl) ctrl.hidden = true;
  const btnT = document.getElementById('btnTorch');
  if (btnT) btnT.classList.remove('on');
  const zl = document.getElementById('zoomLabel');
  if (zl) zl.textContent = '1×';
  scanning = false;
}

function extractSerial(raw) {
  const s = raw.replace(/\s/g, '');
  const m = s.match(/8966\d{14}/);
  if (m) return m[0];
  if (/^8966\d{14}$/.test(s)) return s;
  const m2 = s.match(/\d{18}/);
  return m2 ? m2[0] : null;
}

function resetScan() {
  document.getElementById('camResult').hidden = true;
  document.getElementById('camIdle').hidden   = false;
}

// ── Serial detected ──
async function onSerialDetected(serial, mode) {
  const now = new Date().toLocaleString('th-TH', {
    timeZone: 'Asia/Bangkok', hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });

  if (mode === 'scan') {
    // Show result overlay inside camera area
    const res = document.getElementById('camResult');
    document.getElementById('camSerialText').textContent = serial;
    document.getElementById('camTgStatus').textContent   = '⏳ กำลังส่งให้เจ้าของร้าน...';
    document.getElementById('camTgStatus').className     = 'cam-tg-status';
    // Reset redirect bar by removing + re-adding
    const fill = document.getElementById('camRedirectFill');
    fill.style.animation = 'none';
    void fill.offsetWidth; // reflow
    fill.style.animation = '';
    res.hidden = false;

    const tgOk = await sendTelegram(serial, mode, now);
    updateTgStatus(document.getElementById('camTgStatus'), tgOk, 'cam');

    setTimeout(() => redirectToTrue(serial), 2500);

  } else {
    // Manual pane result
    const el = document.getElementById('manualResult');
    el.innerHTML = `
      <div class="manual-result" id="mRes">
        <div class="result-serial">${serial}</div>
        <div class="result-status" id="mTgStatus">⏳ กำลังส่งให้เจ้าของร้าน...</div>
      </div>`;
    document.getElementById('btnSubmit').disabled = true;

    const tgOk = await sendTelegram(serial, mode, now);
    const mTg = document.getElementById('mTgStatus');
    if (mTg) updateTgStatus(mTg, tgOk, 'manual');

    setTimeout(() => redirectToTrue(serial), 2500);
    setTimeout(() => {
      const btn = document.getElementById('btnSubmit');
      if (btn) btn.disabled = false;
    }, 3000);
  }
}

function updateTgStatus(el, tgOk, ctx) {
  if (!el) return;
  if (tgOk === true) {
    if (ctx === 'cam') {
      el.textContent = '✅ ส่งแจ้งเตือนเจ้าของร้านแล้ว';
      el.className   = 'cam-tg-status cam-tg-ok';
    } else {
      el.textContent = '✅ ส่งแจ้งเตือนเจ้าของร้านแล้ว';
      el.style.color = '#16a34a';
    }
  } else if (tgOk === false) {
    if (ctx === 'cam') {
      el.textContent = '⚠️ ส่ง Telegram ไม่ได้ — แจ้งพนักงาน';
      el.className   = 'cam-tg-status cam-tg-err';
    } else {
      el.textContent = '⚠️ ส่ง Telegram ไม่ได้ — แจ้งพนักงาน';
      el.style.color = '#d97706';
    }
  } else {
    const msg = 'ℹ️ ยังไม่ตั้งค่า Telegram';
    if (ctx === 'cam') { el.textContent = msg; el.className = 'cam-tg-status'; }
    else { el.textContent = msg; }
  }
}

async function sendTelegram(serial, mode, now) {
  if (!tgBot || !tgChat) return null;
  const msg = `📲 ลูกค้าสแกนซิมแล้ว!\n📋 Serial: ${serial}\n🕐 เวลา: ${now}\n📥 วิธีรับ: ${mode === 'scan' ? 'สแกนบาร์โค้ด' : 'กรอกเอง'}\n\n⏩ กำลังพาลูกค้าไปลงทะเบียน True...`;
  try {
    const r = await fetch(`https://api.telegram.org/bot${tgBot}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: tgChat, text: msg })
    });
    const d = await r.json();
    return d.ok === true;
  } catch(e) { return false; }
}

function redirectToTrue(serial) {
  window.location.href = `https://www.true.th/service/trueservice/registersim/?serial=${encodeURIComponent(serial)}`;
}

// ── Manual submit ──
function submitManual() {
  const serial = document.getElementById('manualSerial').value.replace(/\D/g, '');
  if (serial.length < 10) { showToast('กรุณากรอกเลขซีเรียลให้ครบ'); return; }
  const now = new Date().toLocaleString('th-TH', { timeZone: 'Asia/Bangkok', hour12: false });
  onSerialDetected(serial, 'manual');
}

</script>
