<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>ลงทะเบียนซิม</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0e0e1f;
  min-height:100vh;
  font-family:'Sarabun',sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  padding:28px 18px 60px;
}
.wrap{width:100%;max-width:400px}

/* Header */
.icon{text-align:center;font-size:52px;margin-bottom:6px;line-height:1}
.title{text-align:center;font-size:26px;font-weight:900;margin-bottom:12px;letter-spacing:-0.5px}
.badge-row{display:flex;justify-content:center;margin-bottom:22px}
.badge{
  background:rgba(109,93,244,0.35);
  border:1.5px solid rgba(139,120,255,0.55);
  color:#c4b5fd;
  border-radius:99px;
  padding:7px 24px;
  font-size:14px;
  font-weight:700;
}

/* Barcode box */
.bc-wrap{
  background:#fff;
  border-radius:18px;
  padding:18px 16px 14px;
  margin-bottom:16px;
  text-align:center;
  box-shadow:0 2px 16px rgba(0,0,0,0.3);
}
.bc-num{
  color:#0e0e1f;
  font-size:17px;
  font-weight:800;
  margin-top:10px;
  font-family:monospace;
  letter-spacing:3px;
}

/* Step card */
.step-card{
  background:rgba(67,56,202,0.18);
  border:1.5px solid rgba(99,102,241,0.5);
  border-radius:18px;
  padding:20px 18px 18px;
  margin-bottom:16px;
}
.step-label{
  text-align:center;
  color:#a5b4fc;
  font-size:14px;
  font-weight:700;
  margin-bottom:14px;
}
.serial-disp{
  background:rgba(67,56,202,0.25);
  border:2px solid #6366f1;
  border-radius:14px;
  padding:18px 10px 22px;
  text-align:center;
  font-size:36px;
  font-weight:900;
  font-family:monospace;
  letter-spacing:2px;
  word-break:break-all;
  color:#fff;
  margin-bottom:12px;
  min-height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.hint{
  text-align:center;
  color:#fbbf24;
  font-size:13px;
  font-weight:600;
}

/* Buttons */
.btn-copy{
  width:100%;
  padding:18px;
  border:none;
  border-radius:14px;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  font-family:'Sarabun',sans-serif;
  margin-bottom:12px;
  background:linear-gradient(135deg,#16a34a,#22c55e);
  color:#fff;
  letter-spacing:0.2px;
  transition:opacity .15s;
}
.btn-copy:active{opacity:.8}

.btn-reg{
  width:100%;
  padding:18px;
  border:none;
  border-radius:14px;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  font-family:'Sarabun',sans-serif;
  background:linear-gradient(135deg,#dc2626,#ef4444);
  color:#fff;
  letter-spacing:0.2px;
  transition:opacity .15s;
  margin-bottom:12px;
}
.btn-reg:active{opacity:.8}

.confirm-row{
  display:none;
  align-items:center;
  gap:6px;
  justify-content:center;
  color:#4ade80;
  font-size:13px;
  font-weight:700;
  margin-bottom:10px;
}

/* Toast */
.toast{
  position:fixed;
  bottom:32px;
  left:50%;
  transform:translateX(-50%);
  background:#1e2035;
  border:1px solid rgba(255,255,255,0.15);
  color:#fff;
  padding:14px 30px;
  border-radius:99px;
  font-size:15px;
  font-weight:700;
  z-index:999;
  white-space:nowrap;
  box-shadow:0 4px 24px rgba(0,0,0,0.6);
}

/* Spin */
.spin{
  width:46px;height:46px;
  border:4px solid rgba(255,255,255,0.1);
  border-top:4px solid #818cf8;
  border-radius:50%;
  animation:sp 1s linear infinite;
  margin:0 auto 16px;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* Input page */
.inp-card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:18px;
  padding:22px;
  margin-bottom:16px;
}
.inp{
  width:100%;
  background:rgba(255,255,255,0.08);
  border:1.5px solid rgba(255,255,255,0.2);
  border-radius:12px;
  padding:15px 16px;
  color:#fff;
  font-size:17px;
  font-family:monospace;
  letter-spacing:1px;
  outline:none;
  margin-bottom:12px;
  transition:border .2s;
}
.inp:focus{border-color:#818cf8}
.btn-check{
  width:100%;
  padding:16px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  font-family:'Sarabun',sans-serif;
  transition:opacity .15s;
}
.btn-check:disabled{opacity:.35;cursor:not-allowed}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div style="text-align:center;padding:120px 0">
    <div class="spin"></div>
    <div style="color:#8b8fa8;font-size:15px">กำลังโหลด...</div>
  </div>
</div>

<script>
const FB="https://simtracker-3a70d-default-rtdb.asia-southeast1.firebasedatabase.app";
const NETS={
  K:{label:"True",color:"#dc2626",url:"https://app.true.th/prepaid-registration?language=th"},
  L:{label:"True",color:"#dc2626",url:"https://app.true.th/prepaid-registration?language=th"},
  A:{label:"AIS",color:"#d97706",url:"https://kyc.cloud.ais.th/client/select-cardtype"},
  D:{label:"True",color:"#dc2626",url:"https://app.true.th/prepaid-registration?language=th"},
};
// ตัดสินใจจากตัวอักษรแรกของ simCode
function resolveNet(code){
  const first=(code||"").toString().toUpperCase().charAt(0);
  if(first==="A")return{label:"AIS",color:"#d97706",url:"https://kyc.cloud.ais.th/client/select-cardtype",...(cfg["A"]||{})};
  return{label:"True",color:"#dc2626",url:"https://app.true.th/prepaid-registration?language=th",...(cfg["K"]||{})};
}
let cfg={},SIM=null,SPATH="",tgSent=false;

const P=k=>new URLSearchParams(location.search).get(k)||"";
const tgbot=P("tgbot"),tgchat=P("tgchat");
const toKey=s=>String(s).replace(/[.#$[\]\/]/g,"_");
const fbGet=p=>fetch(FB+p+".json").then(r=>r.json());
const fbPatch=(p,d)=>fetch(FB+p+".json",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
const fbSet=(p,d)=>fetch(FB+p+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
const net=(code,trackingNo)=>{
  // ดูจากตัวอักษรแรกของ trackingNo ก่อน ถ้าไม่มีค่อยดู simCode
  const src=trackingNo||code||"";
  const first=src.toString().toUpperCase().charAt(0);
  if(first==="A")return{label:"AIS",color:"#d97706",url:"https://kyc.cloud.ais.th/client/select-cardtype",...(cfg["A"]||{})};
  return{label:"True",color:"#dc2626",url:"https://app.true.th/prepaid-registration?language=th",...(cfg["K"]||{})};
};

function tg(txt){
  if(!tgbot){toast("❌ ไม่พบ Bot Token ในลิงก์");return;}
  if(!tgchat){toast("❌ ไม่พบ Chat ID ในลิงก์");return;}
  if(tgSent)return;
  tgSent=true;
  fetch(`https://api.telegram.org/bot${tgbot}/sendMessage`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({chat_id:tgchat,text:txt})
  }).then(r=>{
    if(!r.ok)r.json().then(d=>toast("❌ Telegram error: "+d.description)).catch(()=>toast("❌ Telegram ส่งไม่สำเร็จ"));
  }).catch(e=>toast("❌ Network error: "+e.message));
}

// Barcode SVG (visual only)
function bc(text){
  const H=80;let s="",x=8;
  const seed=text.split("").reduce((a,c)=>a+c.charCodeAt(0),0);
  for(let i=0;i<text.length;i++){
    const c=text.charCodeAt(i),r=(c*31+seed)%17;
    const w1=2+(r%2),g1=1+(i%2),w2=3-((r>>1)%2),g2=1+(r%3);
    s+=`<rect x="${x}" y="4" width="${w1}" height="${H-8}" fill="#111"/>`;x+=w1+g1;
    s+=`<rect x="${x}" y="0" width="${w2}" height="${H}" fill="#111"/>`;x+=w2+g2;
  }
  s=`<rect x="2" y="0" width="3" height="${H}" fill="#111"/>
     <rect x="6" y="0" width="1" height="${H}" fill="#111"/>`+s+
    `<rect x="${x+2}" y="0" width="3" height="${H}" fill="#111"/>
     <rect x="${x+6}" y="0" width="1" height="${H}" fill="#111"/>`;
  return`<svg viewBox="0 0 ${x+12} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style="width:100%;height:80px">${s}</svg>`;
}

function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div");
  t.className="toast";t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

// ===== โหลด net config =====
async function init(){
  try{
    const d=await fbGet("/net_config");
    if(d&&typeof d==="object"&&!d.error)Object.keys(NETS).forEach(k=>{if(d[k])cfg[k]={...d[k]};});
  }catch(e){}
  const serial=P("s")||P("serial")||"";
  if(serial.length>=5)await autoLoad(serial);
  else showInput();
}

async function autoLoad(serial){
  render(`<div style="text-align:center;padding:120px 0">
    <div class="spin"></div>
    <div style="color:#a5b4fc;font-weight:700;font-size:15px;margin-bottom:6px">กำลังดึงข้อมูลซิม...</div>
    <div style="color:#6b7280;font-size:13px;font-family:monospace">${serial}</div>
  </div>`);

  // ดึง param จาก URL ที่ฝังมากับ QR Code
  const urlTracking=P("t")||P("tracking")||"";
  const urlPhone=P("phone")||"";
  const urlNet=P("net")||"";

  try{
    const to=t=>new Promise((_,r)=>setTimeout(r,t));
    const g=p=>Promise.race([fbGet(p).catch(()=>null),to(6000).then(()=>null)]);
    const [d1,d2,d3]=await Promise.all([g("/sims/"+toKey(serial)),g("/sims_plain/"+toKey(serial)),g("/sims_free/"+toKey(serial))]);
    const sim=[d1,d2,d3].find(d=>d&&d.serial)||null;
    SPATH=d1?.serial?"/sims":d2?.serial?"/sims_plain":d3?.serial?"/sims_free":"/sims";
    // merge ข้อมูลจาก URL เข้ากับข้อมูล Firebase (URL มีความน่าเชื่อถือสูงเพราะร้านเป็นคนสร้าง)
    SIM={
      serial,
      trackingNo:sim?.trackingNo||urlTracking||"",
      simCode:sim?.simCode||urlNet||"K",
      phone:sim?.phone||urlPhone||"",
      ...(sim||{})
    };
  }catch(e){
    SIM={serial,trackingNo:urlTracking,simCode:urlNet||"K",phone:urlPhone};
    SPATH="/sims";
  }
  showResult();
}

// ===== หน้าผลลัพธ์ (ตามรูป) =====
function showResult(){
  const s=SIM;
  const n=net(s.simCode,s.trackingNo);
  const col=n.color||"#dc2626";
  const hasPhone=s.phone&&s.phone.length>=9;
  render(`
    <div class="icon">📱</div>
    <div class="title">รับเลขซีเรียลซิมของคุณ</div>
    <div style="height:8px"></div>

    <div class="bc-wrap">
      ${bc(s.serial)}
      <div class="bc-num">${s.serial}</div>
      <div style="color:#6b7280;font-size:13px;margin-top:8px;font-weight:600">ซิมหมายเลข: <span style="color:#a78bfa;font-weight:800">${s.trackingNo||"-"}</span></div>
    </div>

    <div class="step-card">
      <div class="step-label">ขั้นตอนที่ 1 — เลขซีเรียลซิมของคุณ</div>
      <div class="serial-disp">${s.serial}</div>
      <div class="hint">👆 กดปุ่มด้านล่างเพื่อคัดลอกและลงทะเบียนซิม</div>
    </div>

    <div style="background:#1e293b;border:2px solid #3b82f6;border-radius:16px;padding:16px;margin-bottom:16px">
      <div style="color:#93c5fd;font-size:14px;font-weight:800;margin-bottom:10px">📞 ขั้นตอนที่ 2 — กรอกเบอร์โทรที่ได้รับ</div>
      ${hasPhone
        ? `<div style="background:#0f172a;border-radius:10px;padding:12px;text-align:center;margin-bottom:10px">
             <div style="color:#6ee7b7;font-size:22px;font-weight:900;letter-spacing:2px">${s.phone}</div>
             <div style="color:#64748b;font-size:11px;margin-top:4px">เบอร์ที่ได้รับจากซิม</div>
           </div>`
        : `<input id="phone-inp" type="tel" inputmode="numeric" maxlength="10"
             placeholder="กรอกเบอร์ 10 หลัก เช่น 0812345678"
             style="width:100%;box-sizing:border-box;background:#0f172a;border:2px solid #334155;border-radius:10px;padding:14px;color:white;font-size:18px;font-weight:700;text-align:center;letter-spacing:2px;outline:none;margin-bottom:8px"
             oninput="this.value=this.value.replace(/[^0-9]/g,'');checkPhone()"
           />
           <div style="display:flex;gap:8px;margin-top:6px">
             <label style="flex:1;display:flex;align-items:center;gap:8px;background:#0f172a;border:2px solid #334155;border-radius:10px;padding:12px;cursor:pointer">
               <input type="checkbox" id="no-phone-chk" onchange="checkPhone()" style="width:18px;height:18px;accent-color:#f59e0b">
               <span style="color:#f59e0b;font-size:13px;font-weight:700">📦 รับเบอร์หลังลงทะเบียน</span>
             </label>
           </div>`
      }
    </div>

    <button class="btn-reg" id="breg" style="background:linear-gradient(135deg,${col},${col}bb);opacity:${hasPhone?1:0.4};pointer-events:${hasPhone?'auto':'none'}"
      onclick="doReg()">📝 ลงทะเบียนซิม</button>
  `);
  if(!hasPhone){
    // focus input
    setTimeout(()=>{const el=document.getElementById('phone-inp');if(el)el.focus();},100);
  }
}


function checkPhone(){
  const inp=document.getElementById('phone-inp');
  const chk=document.getElementById('no-phone-chk');
  const btn=document.getElementById('breg');
  if(!btn)return;
  const phone=inp?inp.value.trim():'';
  const noPhone=chk?chk.checked:false;
  const valid=phone.match(/^0\d{9}$/)||noPhone;
  btn.style.opacity=valid?'1':'0.4';
  btn.style.pointerEvents=valid?'auto':'none';
  if(valid&&phone)SIM.phone=phone;
  if(noPhone)SIM.phone='';
}

function fb(t){const e=document.createElement("textarea");e.value=t;document.body.appendChild(e);e.select();document.execCommand("copy");e.remove();}

async function doReg(){
  const s=SIM,n=net(s.simCode,s.trackingNo);
  if(!n.url){toast("⚠️ ยังไม่มีลิงก์ลงทะเบียน กรุณาติดต่อร้านค้า");return;}
  const now=Date.now();
  if(navigator.clipboard){navigator.clipboard.writeText(s.serial).catch(()=>fb(s.serial));}else fb(s.serial);

  // เช็ค Firebase ทุก path ก่อนส่ง Telegram
  let alreadyNotified=false;
  const ym=new Date(now).toISOString().slice(0,7).replace("-","");
  const ymPrev=new Date(now-30*86400000).toISOString().slice(0,7).replace("-","");
  const key=toKey(s.serial);
  try{
    const to=ms=>new Promise(r=>setTimeout(()=>r(null),ms));
    const checks=await Promise.all([
      Promise.race([fbGet("/sims_plain/"+key),to(2000)]).catch(()=>null),
      Promise.race([fbGet("/sims_free/"+key),to(2000)]).catch(()=>null),
      Promise.race([fbGet("/sims/"+key),to(2000)]).catch(()=>null),
      Promise.race([fbGet("/history/"+ym+"/"+key),to(2000)]).catch(()=>null),
      Promise.race([fbGet("/history/"+ymPrev+"/"+key),to(2000)]).catch(()=>null),
    ]);
    for(const d of checks){
      if(d&&(d.tgNotified||d.scannedByCustomer)){alreadyNotified=true;break;}
    }
  }catch(e){}

  // เขียน scannedByCustomer ก่อน แต่ยังไม่ set tgNotified
  fbPatch(SPATH+"/"+key,{scannedByCustomer:true,scannedAt:now}).catch(()=>{});

  // ส่ง Telegram เฉพาะครั้งแรกเท่านั้น
  if(!alreadyNotified){
    const sendWithSummary=async()=>{
      const simType=((SIM.simType==="free"||SPATH==="/sims_free")?"🎁 ซิมฟรีเดือนแรก":"📦 ซิมเปล่า");
      tg(
        "🔔 ลูกค้าลงทะเบียนซิมแล้ว!\n"+
        simType+"\n"+
        "📋 เลขซีเรียลซิม: "+s.serial+"\n"+
        "🔢 เลขติดตาม: "+s.trackingNo+"\n"+
        "📶 เครือข่าย: "+n.label+"\n"+
        (s.phone?"📞 เบอร์: "+s.phone+"\n":"")+
        "⏰ เวลา: "+new Date(now).toLocaleString("th-TH")
      );
      // บันทึก history หลังส่ง Telegram สำเร็จ
      const historyRecord={
        serial:s.serial,trackingNo:s.trackingNo,simCode:s.simCode||"",
        simType:s.simType||"plain",phone:s.phone||"",
        scannedAt:now,registeredAt:now,tgNotified:true,
        scannedByCustomer:true,network:n.label,
      };
      fbSet("/history/"+ym+"/"+key,historyRecord).catch(()=>{});
      fbPatch(SPATH+"/"+key,{tgNotified:true}).catch(()=>{});
    };
    sendWithSummary();
  }
  const fbDelete=p=>fetch(FB+p+".json",{method:"DELETE"}).catch(()=>{});
  // ลบออกจากทุก path หลังจาก 3 วินาที
  setTimeout(()=>{
    ["/sims/","/sims_plain/","/sims_free/"].forEach(p=>fbDelete(p+toKey(s.serial)));
  },3000);

  const btn=document.getElementById("breg");
  if(btn){btn.textContent="⏳ กำลังเปิดหน้าลงทะเบียน...";}
  toast("✅ คัดลอกเลขซีเรียลแล้ว กำลังไปหน้าลงทะเบียน...");

  const isFree=SPATH==="/sims_free"||s.simType==="free"||((s.trackingNo||"").toUpperCase().charAt(0)==="L"&&SPATH!=="/sims_plain");
  if(isFree){
    const overlay=document.createElement("div");
    overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px";
    overlay.innerHTML=`
      <div style="background:#fff;border-radius:20px;padding:28px 24px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5)">
        <div style="font-size:19px;font-weight:900;color:#dc2626;margin-bottom:10px">⚠️ สำคัญมาก! อ่านก่อนนะคะ</div>
        <div style="background:#fef9c3;border:2px solid #eab308;border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px;color:#92400e;font-weight:800;line-height:1.8">
          หลังลงทะเบียนจะได้รับ <b>SMS ยืนยัน</b><br/>

// ===== หน้ากรอก serial =====
function showInput(){
  render(`
    <div class="icon">📱</div>
    <div class="title">ลงทะเบียนซิม</div>
    <div style="height:22px"></div>
    <div class="inp-card">
      <div style="color:#94a3b8;font-size:13px;font-weight:700;margin-bottom:10px">📋 เลขซีเรียลซิม</div>
      <input id="si" class="inp" type="text" placeholder="กรอกเลขซีเรียลซิม"
        autocomplete="off" spellcheck="false"
        oninput="document.getElementById('sc').disabled=this.value.trim().length<5"
        onkeydown="if(event.key==='Enter')goChk()"/>
      <button id="sc" class="btn-check" disabled onclick="goChk()">ตรวจสอบ →</button>
    </div>
    <div style="background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:14px;padding:16px;color:#fbbf24;font-size:13px;line-height:2">
      ⚠️ กรอกเลขซีเรียลให้ถูกต้องครบถ้วน<br/>
      🚫 ห้ามลงทะเบียนหลัง 17:00 น.<br/>
      หยุดบริการวันอาทิตย์และวันหยุดนักขัตฤกษ์
    </div>
  `);
}
function goChk(){const v=document.getElementById("si")?.value.trim();if(v&&v.length>=5)autoLoad(v);}
function render(h){document.getElementById("app").innerHTML=h;}
init();
